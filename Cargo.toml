[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.14.0"
authors = ["screwy <screwygit@proton.me>"]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"
description = "Native GTK4/libadwaita music player for Jellyfin, Subsonic, Navidrome and local libraries written in Rust"
repository = "https://github.com/screwys/Rufin"
readme = "README.md"
publish = false

[workspace.dependencies]
adw = { package = "libadwaita", version = "0.9.1" }
apple-native-keyring-store = { version = "1.0.1", features = ["keychain"] }
apple-cf = "=0.6.0"
app-identity = { path = "crates/app-identity" }
async-channel = "2.5.0"
async-trait = "0.1.89"
ashpd = { version = "0.13.13", default-features = false, features = [
    "background",
    "tokio",
] }
artwork = { path = "crates/artwork" }
metadata-lookup = { path = "crates/metadata-lookup" }
base64 = "0.23.0"
blake3 = "1.8.2"
csv = "1.4.0"
directories = "6.0.0"
desktop-integration = { path = "crates/desktop-integration" }
downloads = { path = "crates/downloads" }
ebur128 = "0.1.10"
fcast-sender-sdk = { version = "0.2.0", default-features = false, features = ["chromecast"] }
futures-util = "0.3.32"
getrandom = "0.4.0"
gio = "0.22.6"
gstreamer = "0.25.2"
gstreamer-app = "0.25.2"
gstreamer-audio = "0.25.2"
gstreamer-pbutils = "0.25.2"
gtk = { package = "gtk4", version = "0.11.3" }
glib = "0.22.7"
glib-build-tools = "0.22.8"
httpdate = "1.0.3"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
if-addrs = "0.15.0"
mdns-sd = { version = "0.21.0", default-features = false }
ksni = "0.3.4"
keyring-core = "1.0.0"
library = { path = "crates/library" }
localization = { path = "crates/localization" }
lyrics = { path = "crates/lyrics" }
lofty = "0.25.1"
md5 = "0.8.0"
mediaplayer = "0.4.3"
mpris-server = "0.10.0"
notify = "8.2.0"
oo7 = "0.6.0"
percent-encoding = "2.3.2"
playback = { path = "crates/playback" }
playback-gstreamer = { path = "crates/playback-gstreamer" }
playback-cast = { path = "crates/playback-cast" }
pulldown-cmark = { version = "0.13.0", default-features = false }
scrobbling = { path = "crates/scrobbling" }
reqwest = { version = "0.13.3", default-features = false, features = ["http2", "rustls", "system-proxy"] }
roxmltree = "0.20.0"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
rustix = { version = "1.1.4", features = ["fs"] }
rustfft = "6.2.0"
secrets = { path = "crates/secrets" }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
socket2 = { version = "0.6.5", features = ["all"] }
sqlx = { version = "0.9.0", default-features = false, features = ["derive", "runtime-tokio", "sqlite"] }
sources = { path = "crates/sources" }
tempfile = "3.23.0"
thiserror = "2.0.18"
tray-icon = { version = "0.24.2", default-features = false }
tokio = "1.52.3"
tokio-rustls = { version = "0.26.4", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false }
tiny_http = "0.12.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.23"
ui = { path = "crates/ui" }
url = "2.5.7"
vibrato-rkyv = { version = "=0.7.13", default-features = false }
walkdir = "2.5.0"
wana_kana = { version = "=5.0.0", default-features = false }
windows-native-keyring-store = { version = "1.1.0", default-features = false }
windows-updater = { path = "crates/windows-updater" }
windows = "0.62.2"
winsafe = { version = "0.0.28", features = ["kernel", "ole", "shell", "user"] }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
style = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
large_include_file = "deny"
exit = "deny"
fallible_impl_from = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.test.package.libsqlite3-sys]
opt-level = 3
