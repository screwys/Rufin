[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "ashpd, oo7, mpris-server and ksni still require zbus 5 / zvariant 5. Maintenance advisory after the zbus 6 crate merge; remove when upstream dependencies drop standalone zvariant." },
    { id = "RUSTSEC-2026-0371", reason = "zbus 5 and its macros require zbus_names 4. Maintenance advisory after the zbus 6 crate merge; remove when upstream dependencies migrate to zbus 6 and drop zbus_names." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant 5 requires zvariant_derive 5. Maintenance advisory after the zbus 6 crate merge; remove when upstream dependencies drop standalone zvariant." },
    { id = "RUSTSEC-2026-0374", reason = "Askama 0.16 and i18n-config 0.4 still use basic-toml for build-time configuration. Maintenance advisory with no patched release; remove when these dependencies migrate to toml." },
    { id = "RUSTSEC-2023-0071", reason = "rsa is pulled by smb -> sspi -> picky; Rufin enables only NTLM, with Kerberos and PKU2U disabled, so the affected RSA private-key operations are unused. Reassess if SMB authentication features change." },
    { id = "RUSTSEC-2026-0387", reason = "age 0.12 pulls p256 0.13 -> elliptic-curve 0.13 -> crypto-bigint 0.5, which has no patched release. Rufin uses only age X25519 identities, so the affected P-256 arithmetic (p256tag recipients) is unused. crypto-bigint 0.7 is patched; remove when age moves to p256 0.14." },
    { id = "RUSTSEC-2026-0451", reason = "vodozemac 0.11.1 and earlier leave Olm root and chain keys in freed memory. Rufin uses only vodozemac SAS for Connect pairing and never creates Olm sessions. 0.11.2 needs curve25519-dalek 5.0.0, which conflicts with the =5.0.0-rc.1 pin of smb -> sspi; remove when smb moves to an sspi without that pin." },
    { id = "RUSTSEC-2024-0436", reason = "lofty uses paste, can be removed if they change it to pastey" },
    { id = "RUSTSEC-2026-0441", reason = "smb 0.12 pins sspi 0.21, which pulls async-dnssd -> pin-utils on macOS only. Maintenance advisory with no successor release of async-dnssd; remove when smb moves to an sspi without async-dnssd." },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    { crate = "apple-cf:>=0.8,<0.10", reason = "mediaplayer 0.4.3 still constructs the pre-0.8 CGRect layout" },
]
skip = [
    { crate = "core-foundation@0.9.4", reason = "pulled by system-configuration via hyper-util while rustls-platform-verifier uses core-foundation 0.10" },
    { crate = "getrandom@0.2.17", reason = "pulled by redox_users through directories; direct randomness uses getrandom 0.4" },
    { crate = "getrandom@0.3.4", reason = "pulled by tempfile, rand 0.9 and smb -> sspi while workspace code uses getrandom 0.4" },
    { crate = "r-efi@5.3.0", reason = "pulled by getrandom 0.3 while getrandom 0.4 uses r-efi 6" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
