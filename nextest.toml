[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }

# Two hangs here have no fix yet: a Windows test process that hangs while exiting after its
# test passed, whatever the test does, and playbin3 deadlocking while it sets up a queued
# track during a state change. A test that passes on its retry is listed as flaky. Linux
# stays strict, so a new intermittent failure there still fails the run.
[[profile.default.overrides]]
platform = 'cfg(any(windows, target_os = "macos"))'
retries = 1
