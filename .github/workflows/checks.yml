name: Checks

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - .cargo/**
      - Cargo.lock
      - Cargo.toml
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - crates/**
      - flake.lock
      - flake.nix
      - scripts/rust-cache-command
      - sgconfig.yml
      - '!**/*.md'
      - '!**/*.css'
      - '!**/*.ui'
      - '!**/resources/**'
      - '!crates/gtk-*/**'
      - crates/gtk-*/Cargo.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHIX_CACHE_NAME: rufin

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      build_container_image: ${{ steps.select.outputs.build_container_image }}
      check_workflows: ${{ steps.select.outputs.check_workflows }}
      jobs: ${{ steps.select.outputs.jobs }}
      use_current_nix: ${{ steps.select.outputs.use_current_nix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          package_jobs=(aur_bin flatpak macos nix rpm windows)
          workspace_jobs=(workspace workspace_macos workspace_windows)
          declare -A selected_jobs=()

          add_jobs() {
            local job
            for job in "$@"; do
              selected_jobs["$job"]=1
            done
          }

          build_container_image=false
          check_workflows=false
          use_current_nix=false

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            add_jobs "${package_jobs[@]}" aur_git container
            add_jobs source_checks "${workspace_jobs[@]}" cargo-deny
            build_container_image=true
            check_workflows=true
            use_current_nix=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            add_jobs source_checks "${workspace_jobs[@]}"
          elif [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" && "$HEAD_BRANCH" == release/v* ]]; then
            # The release helper builds and verifies every package in the draft.
            echo "Release preparation defers checks to the draft release builds."
          else
            git cat-file -e "${BASE_SHA}^{commit}"
            git cat-file -e "${HEAD_SHA}^{commit}"
            merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            mapfile -d '' -t changed_paths < <(
              git diff --name-only --no-renames -z "$merge_base" "$HEAD_SHA"
            )

            printf 'Changed paths:\n'
            printf '  %q\n' "${changed_paths[@]}"

            for path in "${changed_paths[@]}"; do
              case "$path" in
                *.rs|*.ui|web/*.html|web/*.js|locales/*.pot|ast-grep/*|sgconfig.yml|Cargo.toml|*/Cargo.toml|Cargo.lock|.cargo/*|.github/workflows/checks.yml)
                  add_jobs source_checks
                  ;;
              esac

              case "$path" in
                LICENSE|resources|resources/*|*/resources/*|web|web/*|locales/*|*.md|*.css|*.ui|*.xml|.github/FUNDING.yml|.github/ISSUE_TEMPLATE/*)
                  continue
                  ;;
              esac

              case "$path" in
                .github/workflows/*.yml|.github/workflows/*.yaml)
                  check_workflows=true
                  ;;
              esac

              case "$path" in
                Cargo.lock|Cargo.toml|*/Cargo.toml)
                  add_jobs "${workspace_jobs[@]}" cargo-deny
                  ;;
                crates/gtk-*/*)
                  ;;
                CMakeLists.txt|CMakePresets.json|cmake/*)
                  # Package builds otherwise run manually or for a draft release.
                  add_jobs "${workspace_jobs[@]}" "${package_jobs[@]}" container
                  ;;
                .github/workflows/container-image.yml|scripts/container|justfile)
                  add_jobs container
                  ;;
                .cargo/*|crates/*)
                  add_jobs "${workspace_jobs[@]}"
                  ;;
                ast-grep/*|sgconfig.yml)
                  ;;
                flake.lock|flake.nix)
                  add_jobs container
                  use_current_nix=true
                  ;;
                scripts/rust-cache-command)
                  add_jobs workspace workspace_windows
                  ;;
                deny.toml)
                  add_jobs cargo-deny
                  ;;
                packaging/container/*)
                  add_jobs container
                  build_container_image=true
                  ;;
                packaging/*|.github/workflows/*.yml|.github/workflows/*.yaml)
                  ;;
                *.avif|*.gif|*.ico|*.icns|*.jpeg|*.jpg|*.png|*.po|*.pot|*.svg|*.webp)
                  ;;
                *)
                  add_jobs workspace
                  ;;
              esac
            done
          fi

          if [[ -n "${selected_jobs[container]+selected}" ]]; then
            unset 'selected_jobs[cargo-deny]' 'selected_jobs[workspace]' 'selected_jobs[source_checks]'
          fi

          if ((${#selected_jobs[@]})); then
            jobs="$(
              printf '%s\n' "${!selected_jobs[@]}" |
                jq -Rsc 'split("\n") | map(select(length > 0)) | sort'
            )"
          else
            jobs='[]'
          fi

          {
            echo "build_container_image=$build_container_image"
            echo "check_workflows=$check_workflows"
            echo "jobs=$jobs"
            echo "use_current_nix=$use_current_nix"
          } >> "$GITHUB_OUTPUT"
          echo "Selected build jobs: $jobs"

      - name: Check workflows
        if: steps.select.outputs.check_workflows == 'true'
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  aur_bin:
    name: AUR rufin-bin
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'aur_bin')
    uses: ./.github/workflows/aur-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      package: rufin-bin
      publish: false

  aur_git:
    name: AUR rufin-git
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'aur_git')
    uses: ./.github/workflows/aur-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      package: rufin-git
      publish: false

  rpm:
    name: RPM
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'rpm')
    uses: ./.github/workflows/rpm-source.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      upload_artifact: false

  nix:
    name: Nix
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'nix')
    uses: ./.github/workflows/nix.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      upload_cache: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  flatpak:
    name: Flatpak
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'flatpak')
    uses: ./.github/workflows/flatpak-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  macos:
    name: Build macOS
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'macos')
    uses: ./.github/workflows/macos-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  windows:
    name: Build Windows
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'windows')
    uses: ./.github/workflows/windows-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  container:
    name: Container
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'container')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build container image
        if: needs.changes.outputs.build_container_image == 'true'
        run: |
          docker build \
            --file packaging/container/Containerfile \
            --tag localhost/rufin-dev:ci \
            packaging/container

      - name: Check Rufin through container
        env:
          RUFIN_CONTAINER_IMAGE: ${{ needs.changes.outputs.build_container_image == 'true' && 'localhost/rufin-dev:ci' || 'ghcr.io/screwys/rufin-dev:latest' }}
          RUFIN_CONTAINER_RUNTIME: docker
        run: |
          set -euo pipefail
          scripts/container setup
          scripts/container run default none just _check-all

  source_checks:
    name: Source checks
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'source_checks')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: |
            extra-substituters = https://rufin.cachix.org
            extra-trusted-public-keys = rufin.cachix.org-1:7+XHqna/b9jZpCorYvZIoE0UjLju4IKbXlJGt35+SNc=

      - name: Check Rust formatting
        run: nix --accept-flake-config develop .#checks --command cargo fmt --all -- --check

      - name: Check translation template
        run: nix --accept-flake-config develop .#checks --command cargo run --locked -p xtask -- generate i18n-template --check

      - name: Check RefCell borrows
        run: nix --accept-flake-config develop .#checks --command just _ast-grep

  workspace:
    name: Workspace
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'workspace')
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Select Nix environment
        id: nix-environment
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
          USE_CURRENT_NIX: ${{ needs.changes.outputs.use_current_nix }}
        run: |
          set -euo pipefail
          if [[ "$USE_CURRENT_NIX" == "true" || -z "$BASE_REF" ]]; then
            echo "target=." >> "$GITHUB_OUTPUT"
          else
            echo "target=github:screwys/Rufin/$BASE_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: |
            connect-timeout = 10
            download-attempts = 5
            extra-substituters = https://rufin.cachix.org
            extra-trusted-public-keys = rufin.cachix.org-1:7+XHqna/b9jZpCorYvZIoE0UjLju4IKbXlJGt35+SNc=
            max-substitution-jobs = 4
            stalled-download-timeout = 90

      - name: Set up Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          prefix-key: v2-rust
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cmd-format: bash scripts/rust-cache-command nix "${{ steps.nix-environment.outputs.target }}" {0}

      - name: Check Rust lints
        if: github.event_name != 'push'
        run: >-
          nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command
          cargo clippy --workspace --exclude 'gtk-*' --exclude rufin --all-targets --locked
          --features app-identity/development

      - name: Run Rust tests
        if: github.event_name != 'push'
        run: >-
          nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command
          cargo nextest run --workspace --exclude 'gtk-*' --exclude rufin --all-targets --locked
          --features app-identity/development --test-threads 4

      - name: Warm Rust build cache
        if: github.event_name == 'push'
        run: |
          nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command \
            cargo check --workspace --exclude 'gtk-*' --exclude rufin --all-targets --locked \
              --features app-identity/development
          nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command \
            cargo test --workspace --exclude 'gtk-*' --exclude rufin --all-targets --locked --no-run \
              --features app-identity/development

  workspace_macos:
    name: Workspace (macOS)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'workspace_macos')
    runs-on: macos-15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/target
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install test dependencies
        run: |
          brew install adwaita-icon-theme cmake gettext game-music-emu gstreamer \
            gtk4 libadwaita libnice-gstreamer libopenmpt libsoup librsvg meson ninja openssl@3 \
            pkgconf shared-mime-info wavpack
          gettext_prefix="$(brew --prefix gettext)"
          echo "GETTEXT_DIR=$gettext_prefix" >> "$GITHUB_ENV"
          echo "$gettext_prefix/bin" >> "$GITHUB_PATH"

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          xcode_app="$(
            find /Applications -maxdepth 1 -type d -name 'Xcode_26.*.app' -print |
              sort -V |
              tail -n 1
          )"
          test -n "$xcode_app"
          developer_dir="$xcode_app/Contents/Developer"
          test -d "$developer_dir"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          sdk_version="$(DEVELOPER_DIR="$developer_dir" xcrun --sdk macosx --show-sdk-version)"
          [[ "$sdk_version" == 26.* ]]
          echo "Using $xcode_app with macOS SDK $sdk_version."

      - name: Prepare playback runtime
        run: |
          cmake --preset development
          cmake --build --preset development --target rufin-runtime-check
          echo "GST_PLUGIN_PATH=$GITHUB_WORKSPACE/.local/build/cmake/development/gst-plugins" >> "$GITHUB_ENV"

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          prefix-key: v1-rust
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          shared-key: macos-arm64
          workspaces: ". -> .local/target"

      - name: Test platform packages or warm their cache
        run: |
          args=(--locked --all-targets
            -p library -p sources -p secrets -p desktop-integration
            -p audio-processing -p playback-gstreamer)
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            args+=(--no-run)
          fi
          cargo test "${args[@]}"

  workspace_windows:
    name: Workspace (Windows)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'workspace_windows')
    runs-on: windows-latest
    env:
      CHERE_INVOKING: 1
      MSYSTEM: UCRT64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-gettext-runtime
            mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-libgfortran
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-perl
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-shared-mime-info
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-wavpack

      - name: Configure Rust paths
        shell: msys2 {0}
        run: |
          echo "CARGO_HOME=$(cygpath -m "$GITHUB_WORKSPACE/.local/cargo")" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$(cygpath -m "$GITHUB_WORKSPACE/.local/target")" >> "$GITHUB_ENV"

      - name: Prepare playback runtime
        shell: msys2 {0}
        run: |
          cmake --preset development
          cmake --build --preset development --target rufin-runtime-check

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          cmd-format: msys2 -c "bash scripts/rust-cache-command direct {0}"
          prefix-key: v1-rust
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          shared-key: windows-ucrt64
          workspaces: ". -> .local/target"

      - name: Test platform packages or warm their cache
        shell: msys2 {0}
        run: |
          args=(--locked --all-targets
            -p library -p sources -p secrets -p desktop-integration
            -p audio-processing -p playback-gstreamer -p windows-updater)
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            args+=(--no-run)
          fi
          cargo test "${args[@]}"

  cargo-deny:
    name: cargo-deny
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'cargo-deny')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --locked
          command: check
          command-arguments: -D unmatched-skip

  required:
    name: Required
    needs:
      - changes
      - aur_bin
      - aur_git
      - rpm
      - nix
      - flatpak
      - macos
      - windows
      - container
      - source_checks
      - workspace
      - workspace_macos
      - workspace_windows
      - cargo-deny
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Enforce selected jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RESULTS: ${{ toJSON(needs) }}
          SELECTED_JOBS: ${{ needs.changes.outputs.jobs || '[]' }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change classification failed: $CHANGES_RESULT" >&2
            exit 1
          fi
          while IFS= read -r job; do
            result="$(jq -r --arg job "$job" '.[$job].result // "missing"' <<< "$RESULTS")"
            if [[ "$result" != "success" ]]; then
              echo "$job did not pass: $result" >&2
              exit 1
            fi
          done < <(jq -r '.[]' <<< "$SELECTED_JOBS")
