name: Nix
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      (startsWith(inputs.ref, 'v') || startsWith(inputs.ref, 'refs/tags/v')) &&
      format('Stage {0}', inputs.ref) ||
      github.event_name == 'workflow_call' && format('Check Nix {0}', inputs.ref) ||
      format('Build Nix {0}', inputs.ref || github.ref_name) }}

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/nix.yml
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - flake.lock
      - flake.nix
      - '!**/*.md'
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      upload_cache:
        required: false
        default: false
        type: boolean
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: nix-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CACHIX_CACHE_NAME: rufin

jobs:
  build:
    name: Build flake
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual build ref
        if: github.event_name == 'workflow_dispatch'
        env:
          BUILD_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ref="$BUILD_REF"

          if [[ "$ref" == "main" || "$ref" == "refs/heads/main" ]]; then
            exit 0
          fi

          tag="${ref#refs/tags/}"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            exit 0
          fi

          echo "Nix cache builds are limited to main or version tags" >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed release tag
        if: startsWith(inputs.ref, 'v') || startsWith(inputs.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ inputs.ref }}
        run: cargo run --locked -p xtask -- verify release-tag "$RELEASE_TAG"

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            connect-timeout = 10
            download-attempts = 5
            extra-substituters = https://rufin.cachix.org
            extra-trusted-public-keys = rufin.cachix.org-1:7+XHqna/b9jZpCorYvZIoE0UjLju4IKbXlJGt35+SNc=
            max-substitution-jobs = 4
            stalled-download-timeout = 90

      - name: Configure Cachix
        if: github.event_name != 'pull_request' || inputs.upload_cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check flake
        run: nix flake check --no-write-lock-file --print-build-logs

      - name: Build app
        id: build
        run: |
          set -euo pipefail
          store_path="$(nix build .#rufin --no-link --print-out-paths --print-build-logs)"
          echo "store-path=$store_path" >> "$GITHUB_OUTPUT"

      - name: Verify package layout
        env:
          STORE_PATH: ${{ steps.build.outputs.store-path }}
        run: cargo run --locked -p xtask -- verify package-layout "$STORE_PATH" /
