name: Windows build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string
      release_tag:
        description: Release version to validate
        default: ""
        required: false
        type: string
      verify_signed_tag:
        description: Verify that the release tag is signed
        default: false
        required: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name == 'pull_request' && github.ref || inputs.release_tag || inputs.ref }}
  cancel-in-progress: true

env:
  MSYSTEM: UCRT64
  CHERE_INVOKING: 1

jobs:
  setup:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MSYS2
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            gnupg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-gettext-runtime
            mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-just
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-perl
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-shared-mime-info
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-wavpack

      - name: Configure Rust paths
        shell: msys2 {0}
        run: |
          echo "CARGO_HOME=$(cygpath -m "$GITHUB_WORKSPACE/.local/cargo")" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$(cygpath -m "$GITHUB_WORKSPACE/.local/target")" >> "$GITHUB_ENV"

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          cache-on-failure: true
          cmd-format: msys2 -c "bash scripts/rust-cache-command direct {0}"
          prefix-key: v1-rust
          save-if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
          shared-key: windows-package-ucrt64
          workspaces: ". -> .local/target"

      - name: Verify signed release tag
        if: inputs.verify_signed_tag
        shell: msys2 {0}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: cargo run --locked -p xtask -- verify release-tag "$RELEASE_TAG"

      - name: Validate release metadata
        if: inputs.release_tag != '' && !inputs.verify_signed_tag
        shell: msys2 {0}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: cargo run --locked -p xtask -- verify release-metadata "$RELEASE_TAG"

      - name: Build Windows installer
        shell: msys2 {0}
        run: |
          set -euo pipefail
          RUFIN_ARTIFACT_ROOT="$PWD/dist" just _build-native-package stable

      - name: Verify packaged executable startup
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE '.local/build/cmake/release-package/Rufin'
          foreach ($name in @('bcrypt.dll', 'kernel32.dll', 'ntdll.dll')) {
            if (Test-Path (Join-Path $stage "bin/$name")) {
              throw "Windows system DLL was bundled: $name"
            }
          }
          # Use the shipped DLLs, without MSYS2 filling gaps in the bundle.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $stdout = Join-Path $env:RUNNER_TEMP 'rufin-package-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'rufin-package-stderr.txt'
          $process = Start-Process -FilePath (Join-Path $stage 'bin/rufin.exe') `
            -ArgumentList '--help' -WorkingDirectory $stage -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Packaged Rufin did not exit within 30 seconds'
          }
          Get-Content $stdout, $stderr
          if ($process.ExitCode -ne 0) {
            throw "Packaged Rufin exited with code $($process.ExitCode)"
          }

      - name: Retain executable symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Rufin-windows-unstripped
          path: .local/target/release/rufin.exe
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: ${{ inputs.release_tag != '' && 90 || 7 }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Rufin-setup.exe
          path: dist/Rufin*-setup.exe
          if-no-files-found: error
          retention-days: 7
