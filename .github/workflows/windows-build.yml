name: Windows build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string
      release_tag:
        description: Release version to validate
        default: ""
        required: false
        type: string
      verify_signed_tag:
        description: Verify that the release tag is signed
        default: false
        required: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name == 'pull_request' && github.ref || inputs.release_tag || inputs.ref }}
  cancel-in-progress: true

env:
  MSYSTEM: UCRT64
  CHERE_INVOKING: 1

jobs:
  setup:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MSYS2
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            gnupg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-gettext-runtime
            mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-just
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-perl
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-shared-mime-info
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-wavpack

      - name: Configure Rust paths
        shell: msys2 {0}
        run: |
          echo "CARGO_HOME=$(cygpath -m "$GITHUB_WORKSPACE/.local/cargo")" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$(cygpath -m "$GITHUB_WORKSPACE/.local/target")" >> "$GITHUB_ENV"

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: "false"
          cmd-format: msys2 -c "bash scripts/rust-cache-command direct {0}"
          prefix-key: v1-rust
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          shared-key: windows-ucrt64
          workspaces: ". -> .local/target"

      - name: Verify signed release tag
        if: inputs.verify_signed_tag
        shell: msys2 {0}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: cargo run --locked -p xtask -- verify release-tag "$RELEASE_TAG"

      - name: Validate release metadata
        if: inputs.release_tag != '' && !inputs.verify_signed_tag
        shell: msys2 {0}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: cargo run --locked -p xtask -- verify release-metadata "$RELEASE_TAG"

      - name: Build Windows installer
        shell: msys2 {0}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          build_identity=development
          if [[ -n "$RELEASE_TAG" ]]; then
            build_identity=stable
          fi
          RUFIN_ARTIFACT_ROOT="$PWD/dist" just _build-windows "$build_identity"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Rufin-setup.exe
          path: dist/Rufin*-setup.exe
          if-no-files-found: error
          retention-days: 7
