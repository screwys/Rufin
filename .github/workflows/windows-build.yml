name: Windows build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string
      release_tag:
        description: Release version to validate
        default: ""
        required: false
        type: string
      verify_signed_tag:
        description: Verify that the release tag is signed
        default: false
        required: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name == 'pull_request' && github.ref || inputs.release_tag || inputs.ref }}
  cancel-in-progress: true

env:
  MSYSTEM: UCRT64
  CHERE_INVOKING: 1

jobs:
  setup:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MSYS2
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          # No package cache: downloading the packages is as fast as restoring them, and each
          # copy takes 530 MB of the repository's 10 GB.
          cache: false
          install: >-
            base-devel
            git
            gnupg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-gettext-runtime
            mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-just
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-libgfortran
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-perl
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-shared-mime-info
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-wavpack

      - name: Configure Rust paths
        shell: msys2 {0}
        run: |
          # Outside the checkout: rust-cache keeps only dependencies outside the workspace root.
          echo "CARGO_HOME=$(cygpath -m "$RUNNER_TEMP/cargo")" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$(cygpath -m "$GITHUB_WORKSPACE/.local/target")" >> "$GITHUB_ENV"

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: "false"
          cache-on-failure: true
          cmd-format: msys2 -c "bash scripts/rust-cache-command direct {0}"
          prefix-key: v1-rust
          save-if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
          shared-key: windows-package-ucrt64
          workspaces: ". -> .local/target"

      - name: Verify signed release tag
        if: inputs.verify_signed_tag
        shell: msys2 {0}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: cargo run --locked -p xtask -- verify release-tag "$RELEASE_TAG"

      - name: Validate release metadata
        if: inputs.release_tag != '' && !inputs.verify_signed_tag
        shell: msys2 {0}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: cargo run --locked -p xtask -- verify release-metadata "$RELEASE_TAG"

      - name: Build Windows installer
        shell: msys2 {0}
        run: |
          set -euo pipefail
          RUFIN_ARTIFACT_ROOT="$PWD/dist" just _build-native-package stable

      - name: Verify installation, upgrade, and executable startup
        shell: pwsh
        run: |
          $stage = Join-Path $env:LOCALAPPDATA 'Programs/Rufin'
          if (Test-Path $stage) {
            throw 'Fresh-install check requires an empty destination'
          }
          $installer = (Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'dist/Rufin-*-setup.exe')).FullName
          foreach ($operation in @('installation', 'upgrade')) {
            $process = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru
            if (-not $process.WaitForExit(120000)) {
              $process.Kill()
              throw "Rufin $operation did not finish within two minutes"
            }
            if ($process.ExitCode -ne 0) {
              throw "Rufin $operation exited with code $($process.ExitCode)"
            }
            foreach ($name in @('LICENSE', 'rufin.ico', 'bin/rufin.exe', 'Uninstall.exe')) {
              if (-not (Test-Path (Join-Path $stage $name))) {
                throw "Installed file is missing: $name"
              }
            }
          }
          foreach ($name in @('bcrypt.dll', 'kernel32.dll', 'ntdll.dll')) {
            if (Test-Path (Join-Path $stage "bin/$name")) {
              throw "Windows system DLL was bundled: $name"
            }
          }
          # The registration and Start Menu shortcuts point at the installed files.
          $root = [IO.Path]::GetFullPath($stage)
          $uninstaller = Join-Path $root 'Uninstall.exe'
          $registration = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Rufin'
          $registered = @{
            InstallLocation = $root
            DisplayIcon = Join-Path $root 'rufin.ico'
            UninstallString = "`"$uninstaller`""
            QuietUninstallString = "`"$uninstaller`" /S"
          }
          foreach ($value in $registered.Keys) {
            if ($registration.$value -ne $registered[$value]) {
              throw "Registered $value is $($registration.$value)"
            }
          }
          $shell = New-Object -ComObject WScript.Shell
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Rufin'
          $shortcuts = @{
            'Rufin.lnk' = Join-Path $root 'bin\rufin.exe'
            'Uninstall Rufin.lnk' = $uninstaller
          }
          foreach ($shortcut in $shortcuts.Keys) {
            $path = Join-Path $menu $shortcut
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Start Menu shortcut is missing: $shortcut"
            }
            $target = $shell.CreateShortcut($path).TargetPath
            if ($target -ne $shortcuts[$shortcut]) {
              throw "$shortcut points at $target"
            }
          }
          $icon = $shell.CreateShortcut((Join-Path $menu 'Rufin.lnk')).IconLocation
          if ($icon -ne "$($registered.DisplayIcon),0") {
            throw "Rufin.lnk uses icon $icon"
          }
          # Use the shipped DLLs, without MSYS2 filling gaps in the bundle.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $stdout = Join-Path $env:RUNNER_TEMP 'rufin-package-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'rufin-package-stderr.txt'
          $process = Start-Process -FilePath (Join-Path $stage 'bin/rufin.exe') `
            -ArgumentList '--help' -WorkingDirectory $stage -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Packaged Rufin did not exit within 30 seconds'
          }
          Get-Content $stdout, $stderr
          if ($process.ExitCode -ne 0) {
            throw "Packaged Rufin exited with code $($process.ExitCode)"
          }

      - name: Verify installed headless playback
        timeout-minutes: 2
        shell: msys2 {0}
        run: |
          cargo run --locked -p xtask -- verify packaged-playback "$LOCALAPPDATA/Programs/Rufin/bin/rufin.exe"

      - name: Verify uninstallation
        shell: pwsh
        run: |
          $root = [IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA 'Programs/Rufin'))
          $data = Join-Path $env:LOCALAPPDATA 'Rufin'
          # /PURGE removes the cache and keeps the rest of the user's data.
          New-Item -ItemType Directory -Force (Join-Path $data 'cache') | Out-Null
          [IO.File]::WriteAllText((Join-Path $data 'cache/check.txt'), 'cache')
          [IO.File]::WriteAllText((Join-Path $data 'check.txt'), 'data')
          # The uninstaller reruns itself from a temporary copy, so the first process exits at once.
          Start-Process -FilePath (Join-Path $root 'Uninstall.exe') -ArgumentList '/S /PURGE'
          $deadline = [DateTime]::Now.AddMinutes(1)
          while (Test-Path -LiteralPath $root) {
            if ([DateTime]::Now -gt $deadline) {
              Get-ChildItem -LiteralPath $root -Recurse -Force | ForEach-Object FullName
              throw 'Uninstallation left the installation folder'
            }
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Rufin') {
            throw 'Uninstallation left the registration'
          }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Rufin')) {
            throw 'Uninstallation left the Start Menu folder'
          }
          if (Test-Path (Join-Path $data 'cache')) {
            throw 'Uninstallation with /PURGE left the cache'
          }
          if (-not (Test-Path (Join-Path $data 'check.txt'))) {
            throw 'Uninstallation with /PURGE removed data outside the cache'
          }

      - name: Verify installer failure recovery
        shell: msys2 {0}
        run: |
          # The minimal MSYS2 PATH leaves out Program Files; PowerShell inherits the
          # UCRT64 PATH that the script's cargo and makensis need. Folder 38 is Program Files.
          "$(cygpath -u -F 38)/PowerShell/7/pwsh.exe" -NoProfile -File packaging/windows/check-installer.ps1 \
            -Compiler "$(cygpath -m "$(command -v makensis)")" \
            -LocaleDir "$(cygpath -m "$PWD/.local/build/cmake/release-package/locale")"

      - name: Retain executable symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Rufin-windows-unstripped
          path: .local/target/release/rufin.exe
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: ${{ inputs.release_tag != '' && 90 || 7 }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Rufin-setup.exe
          path: dist/Rufin*-setup.exe
          if-no-files-found: error
          retention-days: 7
