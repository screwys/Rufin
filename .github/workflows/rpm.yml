name: RPM
run-name: ${{ inputs.upload_release_tag != '' && format('Stage {0}', inputs.upload_release_tag) || format('Build RPM {0}', inputs.ref) }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref containing the RPM packaging tooling
        required: true
        default: main
      upload_release_tag:
        description: Optional existing GitHub release tag to upload the RPMs to
        required: false
        default: ""
      copr_build_id:
        description: Optional existing COPR build to collect for release recovery
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: rpm-${{ inputs.upload_release_tag || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate release target
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual release target
        if: inputs.upload_release_tag != ''
        env:
          BUILD_REF: ${{ inputs.ref }}
          COPR_BUILD_ID: ${{ inputs.copr_build_id }}
          RELEASE_TAG: ${{ inputs.upload_release_tag }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_REF" != "$RELEASE_TAG" && "$BUILD_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "Manual release uploads must build the same tag they upload" >&2
            exit 1
          fi
          if [[ -n "$COPR_BUILD_ID" && ! "$COPR_BUILD_ID" =~ ^[0-9]+$ ]]; then
            echo "COPR build ID must be numeric." >&2
            exit 1
          fi

  srpm:
    name: Generate source RPM
    needs: validate
    uses: ./.github/workflows/rpm-source.yml
    with:
      ref: ${{ inputs.ref }}
      release_tag: ${{ inputs.upload_release_tag }}
      verify_release_tag: ${{ inputs.upload_release_tag != '' }}
      upload_artifact: true

  copr:
    name: Build RPMs in COPR
    if: inputs.upload_release_tag != ''
    needs: srpm
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora-minimal:44
    permissions:
      contents: read
    outputs:
      build_id: ${{ steps.build.outputs.build_id }}

    steps:
      - name: Install COPR client
        run: dnf -y --setopt=install_weak_deps=False install bash copr-cli curl findutils grep jq

      - name: Download source RPM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rpm-srpm
          path: dist

      - name: Configure COPR
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          set -euo pipefail
          test -n "$COPR_CONFIG"
          install -d -m 700 "$HOME/.config"
          printf '%s\n' "$COPR_CONFIG" > "$HOME/.config/copr"
          chmod 600 "$HOME/.config/copr"

      - name: Select and monitor COPR build
        id: build
        env:
          RECOVERY_COPR_BUILD_ID: ${{ inputs.copr_build_id }}
          RELEASE_TAG: ${{ inputs.upload_release_tag }}
        run: |
          set -euo pipefail
          build_id="$RECOVERY_COPR_BUILD_ID"
          if [[ -z "$build_id" ]]; then
            srpm="$(find dist -maxdepth 1 -name 'rufin-*.src.rpm' -print -quit)"
            test -n "$srpm"
            output="$(copr-cli build \
              --nowait \
              --chroot fedora-44-x86_64 \
              --chroot fedora-44-aarch64 \
              --chroot fedora-45-x86_64 \
              --chroot fedora-45-aarch64 \
              screwyy/rufin \
              "$srpm")"
            printf '%s\n' "$output"
            build_line="$(printf '%s\n' "$output" | grep -E '^Created builds: [0-9]+$')"
            build_id="${build_line#Created builds: }"
            [[ "$build_id" =~ ^[0-9]+$ ]]
          else
            echo "Reusing COPR build $build_id."
          fi
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

          expected_version="${RELEASE_TAG#v}-1"
          api_errors=0
          while true; do
            if response="$(curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              --retry-all-errors \
              "https://copr.fedorainfracloud.org/api_3/build/$build_id")" \
              && state="$(jq -er '.state | strings' <<<"$response")"; then
              api_errors=0
            else
              api_errors=$((api_errors + 1))
              if ((api_errors >= 10)); then
                echo "COPR API remained unavailable while monitoring build $build_id." >&2
                exit 1
              fi
              sleep 30
              continue
            fi

            echo "COPR build $build_id: $state"
            case "$state" in
              succeeded|failed)
                if [[ "$state" == failed ]]; then
                  echo "COPR reported failure; checking whether it produced valid signed RPMs before failing."
                  echo "COPR build logs: https://copr.fedorainfracloud.org/coprs/screwyy/rufin/build/$build_id/"
                fi
                break
                ;;
              canceled|skipped)
                exit 1
                ;;
              pending|starting|running|importing|waiting|forked)
                sleep 30
                ;;
              *)
                echo "Unexpected COPR build state: $state" >&2
                exit 1
                ;;
            esac
          done

          if ! jq -e \
            --arg version "$expected_version" \
            '.ownername == "screwyy"
              and .projectname == "rufin"
              and .source_package.name == "rufin"
              and .source_package.version == $version' \
            <<<"$response" >/dev/null; then
            echo "COPR build $build_id does not match screwyy/rufin package rufin $expected_version:" >&2
            jq '{ownername, projectname, source_package: (.source_package | {name, version})}' \
              <<<"$response" >&2
            exit 1
          fi

  packages:
    name: Collect Fedora ${{ matrix.fedora }} RPMs
    needs: copr
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        fedora: [44, 45]
    container:
      image: registry.fedoraproject.org/fedora-minimal:${{ matrix.fedora }}
    permissions:
      contents: read

    steps:
      - name: Install COPR client
        run: dnf -y --setopt=install_weak_deps=False install bash cargo cpio copr-cli curl findutils gawk git gnupg2 grep rpm rpmlint wavpack

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Trust checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure COPR
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          set -euo pipefail
          test -n "$COPR_CONFIG"
          install -d -m 700 "$HOME/.config"
          printf '%s\n' "$COPR_CONFIG" > "$HOME/.config/copr"
          chmod 600 "$HOME/.config/copr"

      - name: Trust COPR package key
        run: |
          set -euo pipefail
          key_path="$(mktemp)"
          curl -fsSL \
            https://download.copr.fedorainfracloud.org/results/screwyy/rufin/pubkey.gpg \
            -o "$key_path"
          fingerprint="$(
            gpg --show-keys --with-colons "$key_path" \
              | awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          test "$fingerprint" = 3C724C8F016C6D63890CFDBFD57ADF06B547821C
          rpm --import "$key_path"

      - name: Collect packages
        env:
          COPR_BUILD_ID: ${{ needs.copr.outputs.build_id }}
          FEDORA: ${{ matrix.fedora }}
        run: |
          set -euo pipefail
          copr-cli download-build \
            --rpms \
            --dest dist/copr \
            --chroot "fedora-${FEDORA}-x86_64" \
            --chroot "fedora-${FEDORA}-aarch64" \
            "$COPR_BUILD_ID"
          mkdir -p dist/release
          x86_rpm_path=
          # Catalogs keep Weblate's script-coded names (zh_Hans, zh_Hant), which rpmlint rejects.
          rpmlint_config="$(mktemp --suffix .toml)"
          cat > "$rpmlint_config" <<'EOF'
          Filters = ['incorrect-locale-subdir /usr/share/locale/[a-z]+_[A-Z][a-z]{3}/LC_MESSAGES/rufin\.mo']
          EOF
          for arch in x86_64 aarch64; do
            mapfile -t rpm_paths < <(
              find "dist/copr/fedora-${FEDORA}-${arch}" \
                -type f \
                -name "rufin-[0-9]*.${arch}.rpm" \
                -print
            )
            test "${#rpm_paths[@]}" -eq 1
            rpm_path="${rpm_paths[0]}"
            rpm --define '_pkgverify_level all' -K "$rpm_path"
            install_root="$(mktemp -d)"
            rpm2cpio "$rpm_path" | cpio -idm --quiet -D "$install_root"
            cargo run --locked -p xtask -- verify package-layout "$install_root" /usr
            rpmlint -c "$rpmlint_config" "$rpm_path"
            cp "$rpm_path" dist/release/
            if [[ "$arch" == x86_64 ]]; then
              x86_rpm_path="$rpm_path"
            fi
          done
          test -n "$x86_rpm_path"
          dnf -y --setopt=install_weak_deps=False install "$x86_rpm_path"
          gst-inspect-1.0 --exists playbin3
          gst-inspect-1.0 --exists audiobuffersplit

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rpm-release-fedora-${{ matrix.fedora }}
          path: dist/release/*.rpm
          if-no-files-found: error
          retention-days: 7

  release:
    name: Upload RPM release assets
    if: inputs.upload_release_tag != ''
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rpm-release-*
          merge-multiple: true
          path: dist

      - name: Verify release assets
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name 'rufin-*.fc44.x86_64.rpm' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name 'rufin-*.fc45.x86_64.rpm' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name 'rufin-*.fc44.aarch64.rpm' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name 'rufin-*.fc45.aarch64.rpm' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name 'rufin-*.src.rpm' | wc -l)" -eq 0

      - name: Attest RPMs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.rpm

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.upload_release_tag }}
        run: |
          set -euo pipefail
          gh release upload \
            "$RELEASE_TAG" \
            dist/*.rpm \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
