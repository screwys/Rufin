name: Credits

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  credits:
    name: Credits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Publish the sponsor and translator images to the credits branch
        env:
          # Any personal token can read the public sponsor list; the Actions token cannot.
          GH_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: |
          scripts/credits-images "$RUNNER_TEMP/credits"
          git switch --orphan credits
          cp "$RUNNER_TEMP"/credits/*.svg .
          git add sponsors.svg translators.svg
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update credits"
          git push --force origin credits
