name: macOS build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string
      release_tag:
        description: Release version to validate
        default: ""
        required: false
        type: string
      verify_signed_tag:
        description: Verify that the release tag is signed
        default: false
        required: false
        type: boolean
    secrets:
      MACOS_SIGNING_CERTIFICATE_PEM_BASE64:
        required: false
      MACOS_SIGNING_PRIVATE_KEY_PEM_BASE64:
        required: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event_name == 'pull_request' && github.ref || inputs.release_tag || inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS ${{ matrix.architecture }} disk image
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/target
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      MACOSX_DEPLOYMENT_TARGET: "15.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          prefix-key: v1-rust
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          shared-key: macos-${{ matrix.architecture }}
          workspaces: ". -> .local/target"

      - name: Verify signed release tag
        if: inputs.verify_signed_tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: cargo run --locked -p xtask -- verify release-tag "$RELEASE_TAG"

      - name: Validate release metadata
        if: inputs.release_tag != '' && !inputs.verify_signed_tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: cargo run --locked -p xtask -- verify release-metadata "$RELEASE_TAG"

      - name: Install packaging dependencies
        run: |
          set -euo pipefail
          if brew tap | grep -Fxq aws/tap; then
            brew untap aws/tap
          fi
          brew install \
            adwaita-icon-theme \
            cmake \
            gettext \
            game-music-emu \
            gstreamer \
            gtk4 \
            just \
            libadwaita \
            libopenmpt \
            libsoup \
            librsvg \
            meson \
            ninja \
            openssl@3 \
            pkgconf \
            shared-mime-info \
            wavpack

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          xcode_app="$(
            find /Applications -maxdepth 1 -type d -name 'Xcode_26.*.app' -print |
              sort -V |
              tail -n 1
          )"
          test -n "$xcode_app"
          developer_dir="$xcode_app/Contents/Developer"
          test -d "$developer_dir"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          sdk_version="$(DEVELOPER_DIR="$developer_dir" xcrun --sdk macosx --show-sdk-version)"
          [[ "$sdk_version" == 26.* ]]
          echo "Using $xcode_app with macOS SDK $sdk_version."

      - name: Install code-signing identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SIGNING_CERTIFICATE_PEM_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PEM_BASE64 }}
          SIGNING_PRIVATE_KEY_PEM_BASE64: ${{ secrets.MACOS_SIGNING_PRIVATE_KEY_PEM_BASE64 }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/rufin-signing.cert.pem"
          private_key_path="$RUNNER_TEMP/rufin-signing.key.pem"
          keychain_path="$RUNNER_TEMP/rufin-signing.keychain-db"
          keychain_password="$(uuidgen)$(uuidgen)"
          openssl_command="$(brew --prefix openssl@3)/bin/openssl"
          if [[ -n "$RELEASE_TAG" ]]; then
            test -n "$SIGNING_CERTIFICATE_PEM_BASE64"
            test -n "$SIGNING_PRIVATE_KEY_PEM_BASE64"
            printf '%s' "$SIGNING_CERTIFICATE_PEM_BASE64" \
              | base64 --decode -o "$certificate_path"
            printf '%s' "$SIGNING_PRIVATE_KEY_PEM_BASE64" \
              | base64 --decode -o "$private_key_path"
            certificate_fingerprint="$(
              "$openssl_command" x509 \
                -in "$certificate_path" \
                -noout \
                -fingerprint \
                -sha256 \
                | sed 's/.*=//; s/://g'
            )"
            test "$certificate_fingerprint" = \
              "1A78A878B19C4C1FC6578386153D900755A4E967D50107233838B34561908368"
            signing_name="Rufin GitHub Signing"
          else
            "$openssl_command" req \
              -newkey rsa:3072 \
              -nodes \
              -x509 \
              -sha256 \
              -days 1 \
              -subj '/CN=Rufin CI Signing/O=Rufin' \
              -addext 'basicConstraints=critical,CA:TRUE' \
              -addext 'keyUsage=critical,digitalSignature' \
              -addext 'extendedKeyUsage=critical,codeSigning' \
              -keyout "$private_key_path" \
              -out "$certificate_path"
            signing_name="Rufin CI Signing"
          fi
          chmod 0600 "$private_key_path"
          sudo security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k /Library/Keychains/System.keychain \
            "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$private_key_path" \
            -k "$keychain_path" \
            -T /usr/bin/codesign
          security import "$certificate_path" \
            -k "$keychain_path" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | awk -v signing_name="$signing_name" \
                'index($0, signing_name) { print $2; exit }'
          )"
          test -n "$signing_identity"
          signing_probe="$RUNNER_TEMP/rufin-signing-probe"
          cp /usr/bin/true "$signing_probe"
          codesign \
            --force \
            --sign "$signing_identity" \
            --keychain "$keychain_path" \
            "$signing_probe"
          codesign --verify --strict "$signing_probe"
          echo "RUFIN_MACOS_SIGN_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "RUFIN_MACOS_SIGN_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build macOS disk image
        run: |
          set -euo pipefail
          gettext_prefix="$(brew --prefix gettext)"
          export PATH="${gettext_prefix}/bin:$PATH"
          RUFIN_ARTIFACT_ROOT="$PWD/dist" \
            RUFIN_DMG_ARTIFACT="$PWD/dist/Rufin-macos-${{ matrix.architecture }}.dmg" \
            just _build-native-package stable

      - name: Remove code-signing keychain
        if: always()
        run: |
          keychain_path="$RUNNER_TEMP/rufin-signing.keychain-db"
          if [[ -e "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Rufin-macos-${{ matrix.architecture }}.dmg
          path: dist/Rufin-macos-${{ matrix.architecture }}.dmg
          if-no-files-found: error
          retention-days: 7
