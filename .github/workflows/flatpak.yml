name: Flatpak

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
      upload_release_tag:
        description: Optional existing GitHub release tag to upload the bundle to
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: io.github.screwys.Rufin
  BUNDLE_NAME: io.github.screwys.Rufin.flatpak
  MANIFEST: packaging/flatpak/io.github.screwys.Rufin.json
  RUNTIME_REPO_URL: https://flathub.org/repo/flathub.flatpakrepo

jobs:
  bundle:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest

    steps:
      - name: Validate release target
        if: github.event_name == 'release' || github.event_name == 'push' || inputs.upload_release_tag != ''
        env:
          BUILD_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref_name || inputs.upload_release_tag }}
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            build_ref="$BUILD_REF"
            if [[ "$build_ref" != "$release_tag" && "$build_ref" != "refs/tags/$release_tag" ]]; then
              echo "Manual release uploads must build the same tag they upload" >&2
              exit 1
            fi
          fi

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y elfutils flatpak flatpak-builder librsvg2-common
          flatpak remote-add --user --if-not-exists flathub "$RUNTIME_REPO_URL"

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref_name || inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed release tag
        if: github.event_name == 'release' || github.event_name == 'push' || inputs.upload_release_tag != ''
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref_name || inputs.upload_release_tag }}
        run: bash .github/scripts/verify-signed-release-tag.sh "$RELEASE_TAG"

      - name: Validate release metadata
        if: github.event_name == 'release' || github.event_name == 'push' || inputs.upload_release_tag != ''
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref_name || inputs.upload_release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          metainfo_version="$(
            sed -n 's/.*<release version="\([^"]*\)".*/\1/p' data/io.github.screwys.Rufin.metainfo.xml |
              head -n 1
          )"

          test "$version" = "$cargo_version"
          test "$version" = "$metainfo_version"

      - name: Build Flatpak repository
        run: |
          set -euo pipefail
          flatpak-builder \
            --user \
            --install-deps-from=flathub \
            --repo=flatpak-repo \
            --force-clean \
            build-dir \
            "$MANIFEST"
          flatpak build-update-repo flatpak-repo

      - name: Build Flatpak bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          flatpak build-bundle \
            --runtime-repo="$RUNTIME_REPO_URL" \
            flatpak-repo \
            "dist/$BUNDLE_NAME" \
            "$APP_ID" \
            master
          ls -lh "dist/$BUNDLE_NAME"

      - name: Verify Flatpak bundle
        run: |
          set -euo pipefail
          flatpak install --user --noninteractive --bundle "dist/$BUNDLE_NAME"
          flatpak info --user "$APP_ID"
          flatpak run --command=sh "$APP_ID" -c '
            test -x /app/bin/rufin
            /app/bin/rufin --help >/dev/null
            test -f /app/share/applications/io.github.screwys.Rufin.desktop
            test -f /app/share/metainfo/io.github.screwys.Rufin.metainfo.xml
          '

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.BUNDLE_NAME }}
          path: dist/${{ env.BUNDLE_NAME }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Upload Flatpak release asset
    if: github.event_name == 'release' || github.event_name == 'push' || inputs.upload_release_tag != ''
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.BUNDLE_NAME }}
          path: dist

      - name: Generate checksum
        run: |
          set -euo pipefail
          cd dist
          sha256sum "$BUNDLE_NAME" > "$BUNDLE_NAME.sha256"

      - name: Attest Flatpak bundle
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: dist/${{ env.BUNDLE_NAME }}

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref_name || inputs.upload_release_tag }}
        run: |
          gh release upload \
            "$RELEASE_TAG" \
            "dist/$BUNDLE_NAME" \
            "dist/$BUNDLE_NAME.sha256" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
