name: AUR
run-name: ${{ inputs.publish && format('Publish AUR {0}', inputs.release_tag || inputs.package) || format('Build AUR {0}', inputs.package) }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to build or publish
        required: true
        default: rufin-bin
        type: choice
        options:
          - rufin-bin
          - rufin-git
          - both
      release_tag:
        description: Existing release tag required for rufin-bin
        required: false
        default: ""
      publish:
        description: Push AUR metadata
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aur-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AUR packages
    uses: ./.github/workflows/aur-build.yml
    with:
      package: ${{ inputs.package }}
      release_tag: ${{ inputs.release_tag }}
      publish: ${{ inputs.publish }}

  publish:
    name: Publish
    needs: build
    if: inputs.publish
    uses: ./.github/workflows/aur-publish.yml
    with:
      package: ${{ needs.build.outputs.package }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
