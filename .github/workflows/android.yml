name: Android

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  android:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up just
        env:
          JUST_VERSION: 1.57.0
          JUST_SHA256: 45b548094283cb9739af8f13273b8cddeee869f5b4ef2bb631b1f311cb566155
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/just.tar.gz"
          tool_dir="$RUNNER_TEMP/just"
          mkdir -p "$tool_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$JUST_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$tool_dir" just
          echo "$tool_dir" >> "$GITHUB_PATH"
          "$tool_dir/just" --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name != 'push' }}

      - name: Restore Robolectric runtime cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-${{ hashFiles('android/app/build.gradle.kts', 'android/app/src/test/**') }}
          restore-keys: ${{ runner.os }}-robolectric-

      - name: Install Android toolchains
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.2" "build-tools;36.1.0" "ndk;29.0.14206865"
          rustup target add aarch64-linux-android

      - name: Restore GStreamer SDK
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: android/.toolchains/gstreamer-1.28.7
          key: gstreamer-android-arm64-1.28.7-fa914bcf8695af1c6fa1f81db2e8da019a0306a89c2c3e48659438e1654023da

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: 'false'
          workspaces: |
            . -> android/build/rust
            . -> target

      - name: Check Android development build
        run: just test android

      - name: Check optimized Android release
        if: github.event_name == 'workflow_dispatch'
        run: android/gradlew -p android -PandroidAbis=arm64-v8a assembleStableRelease lintStableRelease
