name: Android
run-name: ${{ inputs.upload_release_tag != '' && format('Stage {0}', inputs.upload_release_tag) || format('Build Android {0}', inputs.ref) }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build; release uploads must use the matching release tag
        required: true
        default: main
      upload_release_tag:
        description: Optional existing GitHub release tag to upload the APKs to
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.upload_release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release target
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual release target
        if: github.event_name == 'workflow_dispatch' && inputs.upload_release_tag != ''
        env:
          BUILD_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ inputs.upload_release_tag }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_REF" != "$RELEASE_TAG" && "$BUILD_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "Manual release uploads must build the same tag they upload" >&2
            exit 1
          fi

  build:
    name: Android
    needs: validate
    uses: ./.github/workflows/android-build.yml
    with:
      ref: ${{ inputs.ref }}
      release_tag: ${{ inputs.upload_release_tag }}
      verify_signed_tag: ${{ inputs.upload_release_tag != '' }}
    secrets:
      RUFIN_ANDROID_KEYSTORE_BASE64: ${{ secrets.RUFIN_ANDROID_KEYSTORE_BASE64 }}
      RUFIN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RUFIN_ANDROID_KEYSTORE_PASSWORD }}
      RUFIN_ANDROID_KEY_ALIAS: ${{ secrets.RUFIN_ANDROID_KEY_ALIAS }}
      RUFIN_ANDROID_KEY_PASSWORD: ${{ secrets.RUFIN_ANDROID_KEY_PASSWORD }}

  upload:
    name: Upload Android release assets
    if: inputs.upload_release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Rufin-android-apks
          path: dist

      - name: Attest Android APKs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/Rufin-android-*.apk

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.upload_release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/Rufin-android-*.apk --clobber --repo "$GITHUB_REPOSITORY"
