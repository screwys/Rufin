name: Windows

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
      upload_release_tag:
        description: Optional existing GitHub release tag to upload the installer to
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  MSYSTEM: UCRT64
  CHERE_INVOKING: 1

jobs:
  setup:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Validate release target
        if: github.event_name == 'release' || github.event_name == 'push' || inputs.upload_release_tag != ''
        shell: bash
        env:
          BUILD_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref_name || inputs.upload_release_tag }}
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            build_ref="$BUILD_REF"
            if [[ "$build_ref" != "$release_tag" && "$build_ref" != "refs/tags/$release_tag" ]]; then
              echo "Manual release uploads must build the same tag they upload" >&2
              exit 1
            fi
          fi

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref_name || inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MSYS2
        id: msys2
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            gnupg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-gettext-runtime
            mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-perl
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-shared-mime-info
            mingw-w64-ucrt-x86_64-toolchain

      - name: Verify signed release tag
        if: github.event_name == 'release' || github.event_name == 'push' || inputs.upload_release_tag != ''
        shell: msys2 {0}
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref_name || inputs.upload_release_tag }}
        run: bash .github/scripts/verify-signed-release-tag.sh "$RELEASE_TAG"

      - name: Validate release metadata
        if: github.event_name == 'release' || github.event_name == 'push' || inputs.upload_release_tag != ''
        shell: msys2 {0}
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref_name || inputs.upload_release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          metainfo_version="$(
            sed -n 's/.*<release version="\([^"]*\)".*/\1/p' data/io.github.screwys.Rufin.metainfo.xml |
              head -n 1
          )"

          test "$version" = "$cargo_version"
          test "$version" = "$metainfo_version"

      - name: Build Rufin
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cargo build --release --locked -p rufin-app
          target/release/rufin.exe --help >/dev/null

      - name: Stage Windows runtime
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $msysPrefix = Join-Path $env:MSYS2_LOCATION "ucrt64"
          ./packaging/windows/package.ps1 -MsysPrefix $msysPrefix

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build setup.exe
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $stage = Join-Path $PWD "dist/windows/Rufin"
          $output = Join-Path $PWD "dist"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DRUFIN_STAGE_DIR=$stage" "/DRUFIN_OUTPUT_DIR=$output" "/DRUFIN_VERSION=$version" packaging/windows/rufin.iss
          Get-ChildItem dist -Filter "Rufin-*-setup.exe"

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter "Rufin-*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not produced"
          }
          $installDir = Join-Path $env:RUNNER_TEMP "Rufin"
          $installLog = Join-Path $env:RUNNER_TEMP "rufin-install.log"
          $installerArgs = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=`"$installDir`"",
            "/LOG=`"$installLog`""
          )
          $process = Start-Process -FilePath $installer.FullName -ArgumentList $installerArgs -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $installLog) {
              Get-Content $installLog
            }
            throw "Windows installer exited with code $($process.ExitCode)"
          }

          $installedExe = Join-Path $installDir "rufin.exe"
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path $installedExe) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 250
          }
          if (-not (Test-Path $installedExe)) {
            if (Test-Path $installLog) {
              Get-Content $installLog
            }
            throw "Installed Rufin executable was not found: $installedExe"
          }
          $installedDlls = @(Get-ChildItem -LiteralPath $installDir -Filter "*.dll" -File)
          Write-Host "Installed Rufin runtime has $($installedDlls.Count) top-level DLLs"
          if ($installedDlls.Count -eq 0) {
            throw "Installed Rufin runtime has no top-level DLLs"
          }

          $runtimeStdout = Join-Path $env:RUNNER_TEMP "rufin-runtime.out"
          $runtimeStderr = Join-Path $env:RUNNER_TEMP "rufin-runtime.err"
          $previousPath = $env:PATH
          try {
            $env:PATH = "$installDir;$env:PATH"
            $runtimeProcess = Start-Process `
              -FilePath $installedExe `
              -ArgumentList "--validate-runtime" `
              -WorkingDirectory $installDir `
              -RedirectStandardOutput $runtimeStdout `
              -RedirectStandardError $runtimeStderr `
              -Wait `
              -PassThru
          } catch {
            Get-ChildItem $installDir | Select-Object Name, Length
            throw "Installed Rufin executable failed to start: $_"
          } finally {
            $env:PATH = $previousPath
          }
          foreach ($runtimeLog in @($runtimeStdout, $runtimeStderr)) {
            if ((Test-Path $runtimeLog) -and (Get-Item $runtimeLog).Length -gt 0) {
              Get-Content $runtimeLog
            }
          }
          if ($runtimeProcess.ExitCode -ne 0) {
            Get-ChildItem $installDir | Select-Object Name, Length
            throw "Installed Rufin executable exited with code $($runtimeProcess.ExitCode)"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Rufin-setup.exe
          path: dist/Rufin-*-setup.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Upload Windows release asset
    if: github.event_name == 'release' || github.event_name == 'push' || inputs.upload_release_tag != ''
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Rufin-setup.exe
          path: dist

      - name: Generate checksum
        run: |
          set -euo pipefail
          installer="$(find dist -maxdepth 1 -name 'Rufin-*-setup.exe' -print -quit)"
          test -n "$installer"
          sha256sum "$installer" > "$installer.sha256"

      - name: Attest Windows installer
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: dist/Rufin-*-setup.exe

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref_name || inputs.upload_release_tag }}
        run: |
          set -euo pipefail
          installer="$(find dist -maxdepth 1 -name 'Rufin-*-setup.exe' -print -quit)"
          test -n "$installer"
          gh release upload "$RELEASE_TAG" "$installer" "$installer.sha256" --clobber --repo "$GITHUB_REPOSITORY"
