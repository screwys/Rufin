name: Windows
run-name: ${{ inputs.upload_release_tag != '' && format('Stage {0}', inputs.upload_release_tag) || format('Build Windows {0}', inputs.ref) }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build; release uploads must use the matching release tag
        required: true
        default: main
      upload_release_tag:
        description: Optional existing GitHub release tag to upload the installer to
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.upload_release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release target
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual release target
        if: github.event_name == 'workflow_dispatch' && inputs.upload_release_tag != ''
        env:
          BUILD_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ inputs.upload_release_tag }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_REF" != "$RELEASE_TAG" && "$BUILD_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "Manual release uploads must build the same tag they upload" >&2
            exit 1
          fi

  build:
    name: Windows
    needs: validate
    uses: ./.github/workflows/windows-build.yml
    with:
      ref: ${{ inputs.ref }}
      release_tag: ${{ inputs.upload_release_tag }}
      verify_signed_tag: ${{ inputs.upload_release_tag != '' }}

  upload:
    name: Upload Windows release asset
    if: inputs.upload_release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Rufin-setup.exe
          path: dist

      - name: Attest Windows installer
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/Rufin-*-setup.exe

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.upload_release_tag }}
        run: |
          set -euo pipefail
          installer="$(find dist -maxdepth 1 -name 'Rufin-*-setup.exe' -print -quit)"
          test -n "$installer"
          gh release upload "$RELEASE_TAG" "$installer" --clobber --repo "$GITHUB_REPOSITORY"
