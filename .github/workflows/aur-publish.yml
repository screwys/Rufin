name: AUR publish

on:
  workflow_call:
    inputs:
      package:
        description: AUR package set whose metadata this run built
        required: true
        type: string
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish AUR packages
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install publish dependencies
        run: pacman -Syu --noconfirm --needed git openssh

      - name: Download rufin-bin metadata
        if: inputs.package == 'rufin-bin' || inputs.package == 'both'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: aur-bin-metadata
          path: packages/rufin-bin

      - name: Download rufin-git metadata
        if: inputs.package == 'rufin-git' || inputs.package == 'both'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: aur-git-metadata
          path: packages/rufin-git

      - name: Configure AUR SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AUR_SSH_PRIVATE_KEY}" ]]; then
            echo "AUR_SSH_PRIVATE_KEY is not set" >&2
            exit 1
          fi

          install -d -m 700 ~/.ssh
          key_file="$HOME/.ssh/aur"
          key_material="${AUR_SSH_PRIVATE_KEY//$'\r'/}"
          if [[ "$key_material" == *"\\n"* ]]; then
            printf '%b' "$key_material" > "$key_file"
            printf '\n' >> "$key_file"
          elif [[ "$key_material" == *"-----BEGIN "* ]]; then
            printf '%s\n' "$key_material" > "$key_file"
          elif printf '%s' "$key_material" | base64 -d > "$key_file.tmp" 2>/dev/null; then
            mv "$key_file.tmp" "$key_file"
          else
            printf '%s\n' "$key_material" > "$key_file"
          fi
          rm -f "$key_file.tmp"
          chmod 600 "$key_file"
          if ! head -n 1 "$key_file" | grep -q '^-----BEGIN .*PRIVATE KEY-----$'; then
            echo "AUR_SSH_PRIVATE_KEY is not an OpenSSH private key after decoding" >&2
            exit 1
          fi
          secret_fingerprint="$(
            ssh-keygen -y -f "$key_file" |
              ssh-keygen -lf - |
              awk '{print $2}'
          )"
          test "$secret_fingerprint" = "SHA256:N1BBpqTVHS0EDGTCEVNjw02KpaR4onZs8LisHRnsPww"

          ssh-keyscan aur.archlinux.org > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts |
            grep -q "SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4"

          git config --global user.name "screwys"
          git config --global user.email "254296947+screwys@users.noreply.github.com"
          git config --global core.sshCommand \
            "ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

      - name: Publish packages
        env:
          REQUESTED_PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          case "$REQUESTED_PACKAGE" in
            rufin-bin) packages=(rufin-bin) ;;
            rufin-git) packages=(rufin-git) ;;
            both) packages=(rufin-bin rufin-git) ;;
            *) echo "Unknown package: $REQUESTED_PACKAGE" >&2; exit 1 ;;
          esac

          tmpdir="$(mktemp -d)"
          for aur_package in "${packages[@]}"; do
            source_dir="$GITHUB_WORKSPACE/packages/$aur_package"
            repo="$tmpdir/$aur_package"
            if ! git clone "ssh://aur@aur.archlinux.org/${aur_package}.git" "$repo"; then
              mkdir -p "$repo"
              git -C "$repo" init -b master
              git -C "$repo" remote add origin "ssh://aur@aur.archlinux.org/${aur_package}.git"
            fi

            cp "$source_dir/PKGBUILD" "$repo/PKGBUILD"
            cp "$source_dir/.SRCINFO" "$repo/.SRCINFO"
            git -C "$repo" add PKGBUILD .SRCINFO
            if [[ -z "$(git -C "$repo" status --porcelain)" ]]; then
              echo "No AUR changes for $aur_package"
              continue
            fi

            if git -C "$repo" rev-parse --verify HEAD >/dev/null 2>&1; then
              message="Update package"
            else
              message="Initial import"
            fi
            git -C "$repo" commit -m "$message"
            git -C "$repo" push origin master
          done
