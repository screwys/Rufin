name: macOS
run-name: ${{ inputs.upload_release_tag != '' && format('Stage {0}', inputs.upload_release_tag) || format('Build macOS {0}', inputs.ref) }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build; release uploads must use the matching release tag
        required: true
        default: main
      upload_release_tag:
        description: Optional existing GitHub release tag to upload the disk images to
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: macos-release-${{ inputs.upload_release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release target
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual release target
        if: github.event_name == 'workflow_dispatch' && inputs.upload_release_tag != ''
        env:
          BUILD_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ inputs.upload_release_tag }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_REF" != "$RELEASE_TAG" && "$BUILD_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "Manual release uploads must build the same tag they upload" >&2
            exit 1
          fi

  build:
    name: macOS
    needs: validate
    uses: ./.github/workflows/macos-build.yml
    with:
      ref: ${{ inputs.ref }}
      release_tag: ${{ inputs.upload_release_tag }}
      verify_signed_tag: ${{ inputs.upload_release_tag != '' }}
    secrets:
      MACOS_SIGNING_CERTIFICATE_PEM_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PEM_BASE64 }}
      MACOS_SIGNING_PRIVATE_KEY_PEM_BASE64: ${{ secrets.MACOS_SIGNING_PRIVATE_KEY_PEM_BASE64 }}

  upload:
    name: Upload macOS release assets
    if: inputs.upload_release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: Rufin-macos-*.dmg
          path: dist
          merge-multiple: true

      - name: Attest macOS disk images
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/Rufin-macos-*.dmg

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.upload_release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/Rufin-macos-*.dmg --clobber --repo "$GITHUB_REPOSITORY"
