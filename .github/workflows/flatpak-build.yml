name: Flatpak build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string
      release_tag:
        description: Release version to validate
        default: ""
        required: false
        type: string
      verify_signed_tag:
        description: Verify that the release tag is signed
        default: false
        required: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: flatpak-build-${{ inputs.release_tag || inputs.ref }}
  cancel-in-progress: true

env:
  APP_ID: io.github.screwys.Rufin
  RUNTIME_REPO_URL: https://flathub.org/repo/flathub.flatpakrepo

jobs:
  bundle:
    name: Build Flatpak ${{ matrix.architecture }} bundle
    strategy:
      fail-fast: false
      matrix:
        # aarch64 builds run only for releases.
        include: ${{ fromJSON(inputs.release_tag != ''
          && '[{"architecture":"x86_64","runner":"ubuntu-24.04"},{"architecture":"aarch64","runner":"ubuntu-24.04-arm"}]'
          || '[{"architecture":"x86_64","runner":"ubuntu-24.04"}]') }}
    runs-on: ${{ matrix.runner }}
    env:
      BUNDLE_NAME: io.github.screwys.Rufin-${{ matrix.architecture }}.flatpak

    steps:
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            elfutils \
            flatpak \
            flatpak-builder \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-tools \
            just \
            librsvg2-common \
            wavpack
          flatpak remote-add --user --if-not-exists flathub "$RUNTIME_REPO_URL"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed release tag
        if: matrix.architecture == 'x86_64' && inputs.verify_signed_tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: cargo run --locked -p xtask -- verify release-tag "$RELEASE_TAG"

      - name: Validate release metadata
        if: matrix.architecture == 'x86_64' && inputs.release_tag != '' && !inputs.verify_signed_tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: cargo run --locked -p xtask -- verify release-metadata "$RELEASE_TAG"

      - name: Check Cargo sources
        if: matrix.architecture == 'x86_64'
        run: cargo run --locked -p xtask -- generate flatpak-sources --check

      - name: Build Flatpak bundle
        env:
          RUFIN_ARTIFACT_ROOT: ${{ github.workspace }}/dist
        run: just _build-flatpak

      - name: Verify Flatpak bundle
        run: |
          set -euo pipefail
          flatpak install --user --noninteractive --bundle "dist/$BUNDLE_NAME"
          flatpak info --user "$APP_ID"
          install_root="$(flatpak info --user --show-location "$APP_ID")/files"
          cargo run --locked -p xtask -- verify package-layout "$install_root" /

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.BUNDLE_NAME }}
          path: dist/${{ env.BUNDLE_NAME }}
          if-no-files-found: error
          retention-days: 7
