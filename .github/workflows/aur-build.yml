name: AUR build

on:
  workflow_call:
    inputs:
      ref:
        required: false
        default: ""
        type: string
      package:
        required: true
        type: string
      release_tag:
        required: false
        default: ""
        type: string
      publish:
        required: false
        default: false
        type: boolean
    outputs:
      package:
        description: Selected AUR package set
        value: ${{ jobs.prepare.outputs.package }}
      release_tag:
        description: Selected release tag
        value: ${{ jobs.prepare.outputs.release_tag }}

permissions:
  contents: read

concurrency:
  group: aur-build-${{ inputs.package }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare AUR build
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.select.outputs.package }}
      release_tag: ${{ steps.select.outputs.release_tag }}

    steps:
      - name: Select packages and release
        id: select
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISH: ${{ inputs.publish }}
          REQUESTED_PACKAGE: ${{ inputs.package }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          package="$REQUESTED_PACKAGE"
          release_tag="$REQUESTED_TAG"

          case "$package" in
            rufin-bin|rufin-git|both) ;;
            *) echo "Unknown package: $package" >&2; exit 1 ;;
          esac

          if [[ -n "$release_tag" && ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          if [[ "$PUBLISH" == "true" && "$package" != "rufin-git" && -z "$release_tag" ]]; then
            echo "Publishing rufin-bin requires a release tag" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$PUBLISH" == "true" && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Manual AUR publishing must be dispatched from $DEFAULT_BRANCH" >&2
            exit 1
          fi

          {
            echo "package=$package"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

  bin-package:
    name: Build rufin-bin package
    needs: prepare
    if: needs.prepare.outputs.package == 'rufin-bin' || needs.prepare.outputs.package == 'both'
    runs-on: ubuntu-24.04
    container: archlinux:latest

    steps:
      - name: Install bootstrap tools
        run: pacman -Syu --noconfirm --needed base-devel git

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.release_tag || inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install build and runtime dependencies
        run: |
          set -euo pipefail
          source packaging/aur/rufin-git/PKGBUILD
          dependencies=("${depends[@]}" "${makedepends[@]}")
          for index in "${!dependencies[@]}"; do
            if [[ "${dependencies[index]}" == "libgcc_s.so" ]]; then
              dependencies[index]=gcc-libs
            fi
          done
          mapfile -t dependencies < <(printf '%s\n' "${dependencies[@]}" | sort -u)
          pacman -S --noconfirm --needed \
            appstream \
            desktop-file-utils \
            gnupg \
            "${dependencies[@]}"
          for command in appstreamcli bsdtar cargo cmake desktop-file-validate git gpg makepkg msgfmt ninja pkg-config rustc strip tar zstd; do
            command -v "$command"
          done

      - name: Prepare builder user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          install -d -o builder -g builder /home/builder/target "$GITHUB_WORKSPACE/dist"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify source and architecture
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE"
          target="$(runuser -u builder -- rustc -vV | sed -n 's/^host: //p')"
          runuser -u builder -- bash -lc "
            set -euo pipefail
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/bin
            cd '$source_dir'
            cargo fetch --locked --target '$target'
          "
          if [[ -n "$RELEASE_TAG" ]]; then
            runuser -u builder -- bash -lc "
              set -euo pipefail
              export PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/bin
              cd '$source_dir'
              CARGO_TARGET_DIR=/home/builder/target \
                cargo run --frozen -p xtask -- verify release-tag '$RELEASE_TAG'
            "
          fi
          test "$(uname -m)" = "x86_64"

      - name: Build release payload
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' "$source_dir/Cargo.toml" | head -n 1)"
          metainfo_version="$(
            sed -n 's/.*<release version="\([^"]*\)".*/\1/p' \
              "$source_dir/data/io.github.screwys.Rufin.metainfo.xml" |
              head -n 1
          )"
          test "$metainfo_version" = "$version"
          if [[ -n "$RELEASE_TAG" ]]; then
            test "${RELEASE_TAG#v}" = "$version"
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

          staging="/home/builder/package-root"
          target_dir="/home/builder/target"
          install -d -o builder -g builder "$staging"
          runuser -u builder -- bash -lc "
            set -euo pipefail
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/bin
            cd '$source_dir'
            CARGO_TARGET_DIR='$target_dir' \
              cmake \
                -S . \
                -B build-cmake \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DRUFIN_BUILD_IDENTITY=stable \
                -DRUFIN_CARGO_FROZEN=ON
            CARGO_TARGET_DIR='$target_dir' cmake --build build-cmake --target rufin
            DESTDIR='$staging' cmake --install build-cmake
          "

          strip --strip-unneeded "$staging/usr/bin/rufin"

          runuser -u builder -- bash -lc "
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/bin
            cd '$source_dir'
            CARGO_TARGET_DIR='$target_dir' \
              cargo run --frozen -p xtask -- verify package-layout '$staging' /usr
          "
          commit_time="$(runuser -u builder -- git -C "$source_dir" show -s --format=%ct HEAD)"
          tar \
            --sort=name \
            --mtime="@$commit_time" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --use-compress-program='zstd -19 -T0' \
            -cf "$GITHUB_WORKSPACE/dist/rufin-${version}-archlinux-x86_64.tar.zst" \
            -C "$staging" \
            usr

      - name: Render and build rufin-bin
        run: |
          set -euo pipefail
          asset_version="$PACKAGE_VERSION"
          pkgver="${asset_version//-/_}"
          output="$GITHUB_WORKSPACE/dist/aur-bin"
          archive="dist/rufin-${asset_version}-archlinux-x86_64.tar.zst"
          checksum="$(sha256sum "$archive" | awk '{print $1}')"
          install -d -o builder -g builder "$output"
          sed \
            -e "s/@PKGVER@/$pkgver/g" \
            -e "s/@ASSET_VERSION@/$asset_version/g" \
            -e "s/@X86_64_SHA256@/$checksum/g" \
            packaging/aur/rufin-bin/PKGBUILD.template > "$output/PKGBUILD"
          if grep -nE '@(PKGVER|ASSET_VERSION|X86_64_SHA256)@' "$output/PKGBUILD"; then
            echo "Rendered PKGBUILD still contains placeholders" >&2
            exit 1
          fi
          cp "$archive" "$output/"
          chown -R builder:builder "$output"
          runuser -u builder -- bash -lc "
            set -euo pipefail
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/bin
            cd '$output'
            makepkg --cleanbuild --clean --noconfirm --noprogressbar
            makepkg --printsrcinfo > .SRCINFO
          "

      - name: Verify built rufin-bin package
        run: |
          set -euo pipefail
          pkgfile="$(find dist/aur-bin -maxdepth 1 -name 'rufin-bin-*.pkg.tar.zst' -print -quit)"
          test -n "$pkgfile"
          pkgroot="$(mktemp -d)"
          bsdtar -xf "$pkgfile" -C "$pkgroot"
          test -x "$pkgroot/usr/bin/rufin"
          test -f "$pkgroot/usr/share/applications/io.github.screwys.Rufin.desktop"
          test -f "$pkgroot/usr/share/licenses/rufin/japanese-readings.LICENSE"
          test -f "$pkgroot/usr/share/metainfo/io.github.screwys.Rufin.metainfo.xml"
          test -f "$pkgroot/usr/share/rufin/japanese-readings.dic"
          pacman -U --noconfirm "$pkgfile"
          desktop-file-validate /usr/share/applications/io.github.screwys.Rufin.desktop
          appstreamcli validate --no-net /usr/share/metainfo/io.github.screwys.Rufin.metainfo.xml
          pacman -Rns --noconfirm rufin-bin

      - name: Upload Arch payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: archlinux-x86_64
          path: dist/rufin-*-archlinux-x86_64.tar.zst
          if-no-files-found: error
          retention-days: 7

      - name: Upload rufin-bin metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aur-bin-metadata
          path: |
            dist/aur-bin/PKGBUILD
            dist/aur-bin/.SRCINFO
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  git-package:
    name: Build rufin-git package
    needs: prepare
    if: needs.prepare.outputs.package == 'rufin-git' || needs.prepare.outputs.package == 'both'
    runs-on: ubuntu-24.04
    container: archlinux:latest

    steps:
      - name: Install bootstrap tools
        run: pacman -Syu --noconfirm --needed base-devel git

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install package dependencies
        run: |
          set -euo pipefail
          source packaging/aur/rufin-git/PKGBUILD
          dependencies=("${depends[@]}" "${makedepends[@]}")
          for index in "${!dependencies[@]}"; do
            if [[ "${dependencies[index]}" == "libgcc_s.so" ]]; then
              dependencies[index]=gcc-libs
            fi
          done
          mapfile -t dependencies < <(printf '%s\n' "${dependencies[@]}" | sort -u)
          pacman -S --noconfirm --needed \
            appstream \
            desktop-file-utils \
            gnupg \
            "${dependencies[@]}"
          for command in appstreamcli bsdtar cargo cmake desktop-file-validate git gpg makepkg msgfmt ninja pkg-config rustc strip tar zstd; do
            command -v "$command"
          done

      - name: Prepare builder user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          runuser -u builder -- git -C "$GITHUB_WORKSPACE" branch --force ci-candidate HEAD

      - name: Build package
        run: |
          candidate_commit="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          runuser -u builder -- bash -lc "
            set -euo pipefail
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/bin
            cd '$GITHUB_WORKSPACE/packaging/aur/rufin-git'
            diff -u .SRCINFO <(makepkg --printsrcinfo)
            sed -i \
              's|git+https://github.com/screwys/Rufin.git|git+file://$GITHUB_WORKSPACE#branch=ci-candidate|' \
              PKGBUILD
            makepkg --cleanbuild --noconfirm --noprogressbar
            test \"\$(git -C src/Rufin rev-parse HEAD)\" = '$candidate_commit'
            sed -i \
              's|git+file://$GITHUB_WORKSPACE#branch=ci-candidate|git+https://github.com/screwys/Rufin.git|' \
              PKGBUILD
            git diff --exit-code -I '^pkgver=' -- PKGBUILD
            makepkg --printsrcinfo > .SRCINFO
          "

      - name: Verify built package
        run: |
          set -euo pipefail
          pkgfile="$(find packaging/aur/rufin-git -maxdepth 1 -name 'rufin-git-*.pkg.tar.zst' ! -name '*-debug-*' -print -quit)"
          test -n "$pkgfile"
          pkgroot="$(mktemp -d)"
          bsdtar -xf "$pkgfile" -C "$pkgroot"
          test -x "$pkgroot/usr/bin/rufin"
          test -f "$pkgroot/usr/share/applications/io.github.screwys.Rufin.desktop"
          test -f "$pkgroot/usr/share/licenses/rufin/japanese-readings.LICENSE"
          test -f "$pkgroot/usr/share/metainfo/io.github.screwys.Rufin.metainfo.xml"
          test -f "$pkgroot/usr/share/rufin/japanese-readings.dic"
          pacman -U --noconfirm "$pkgfile"
          desktop-file-validate /usr/share/applications/io.github.screwys.Rufin.desktop
          appstreamcli validate --no-net /usr/share/metainfo/io.github.screwys.Rufin.metainfo.xml
          pacman -Rns --noconfirm rufin-git

      - name: Stage rufin-git metadata
        run: |
          mkdir -p dist/aur-git
          cp packaging/aur/rufin-git/PKGBUILD packaging/aur/rufin-git/.SRCINFO dist/aur-git/

      - name: Upload rufin-git metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aur-git-metadata
          path: |
            dist/aur-git/PKGBUILD
            dist/aur-git/.SRCINFO
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
