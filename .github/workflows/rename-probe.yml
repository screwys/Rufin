# Temporary: checks on real Windows and macOS what the app ID change does to saved logins and
# data folders. Remove it with crates/secrets/examples/rename_probe.rs once it has reported.
name: Rename probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Rename probe (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the probe
        run: cargo build --locked -p secrets --example rename_probe
      - name: Credential Manager and data folders
        run: |
          set -euo pipefail
          mkdir -p old new
          cp target/debug/examples/rename_probe.exe old/rufin.exe
          cp target/debug/examples/rename_probe.exe new/rufin-renamed.exe
          service=io.github.screwys.Rufin
          old/rufin.exe write "$service" probe-user probe-secret
          status=0; new/rufin-renamed.exe read "$service" probe-user probe-secret || status=$?
          echo "another program reads the old entry: exit $status (0 = read without asking)"
          test "$status" -eq 0
          status=0; new/rufin-renamed.exe read app.rufin.rufin probe-user probe-secret || status=$?
          echo "the new name finds the old entry: exit $status (2 = not found)"
          test "$status" -eq 2
          old/rufin.exe delete "$service" probe-user
          paths="$(old/rufin.exe paths)"
          echo "$paths"
          grep -F 'AppData\Roaming\screwys\Rufin\config' <<<"$paths"
          grep -F 'AppData\Local\screwys\Rufin\cache' <<<"$paths"

  macos:
    name: Rename probe (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the probe twice
        run: |
          set -euo pipefail
          cargo build --locked -p secrets --example rename_probe
          mkdir -p old update renamed
          cp target/debug/examples/rename_probe old/rufin
          RUFIN_PROBE_BUILD=2 cargo build --locked -p secrets --example rename_probe
          cp target/debug/examples/rename_probe update/rufin
          cp target/debug/examples/rename_probe renamed/rufin
          if cmp -s old/rufin update/rufin; then
            echo "The second build is identical; it cannot stand for an update." >&2
            exit 1
          fi
      - name: Install a self-signed signing identity, as release signing does
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/probe.cert.pem"
          private_key_path="$RUNNER_TEMP/probe.key.pem"
          keychain_path="$RUNNER_TEMP/probe.keychain-db"
          keychain_password="$(uuidgen)$(uuidgen)"
          openssl_command="$(brew --prefix openssl@3)/bin/openssl"
          "$openssl_command" req \
            -newkey rsa:3072 \
            -nodes \
            -x509 \
            -sha256 \
            -days 1 \
            -subj '/CN=Rufin Probe Signing/O=Rufin' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,digitalSignature' \
            -addext 'extendedKeyUsage=critical,codeSigning' \
            -keyout "$private_key_path" \
            -out "$certificate_path"
          chmod 0600 "$private_key_path"
          sudo security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k /Library/Keychains/System.keychain \
            "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$private_key_path" -k "$keychain_path" -T /usr/bin/codesign
          security import "$certificate_path" -k "$keychain_path" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | awk 'index($0, "Rufin Probe Signing") { print $2; exit }'
          )"
          test -n "$signing_identity"
          echo "PROBE_SIGN_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "PROBE_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
      - name: Keychain access after the identifier changes, and data folders
        run: |
          set -euo pipefail
          sign() {
            codesign --force --sign "$PROBE_SIGN_IDENTITY" --keychain "$PROBE_KEYCHAIN" \
              --identifier "$2" "$1"
            codesign --display --requirements - "$1" 2>&1 | tail -1
          }
          sign old/rufin io.github.screwys.Rufin
          sign update/rufin io.github.screwys.Rufin
          sign renamed/rufin app.rufin.rufin
          service=io.github.screwys.Rufin
          old/rufin write "$service" probe-user probe-secret
          status=0; old/rufin read "$service" probe-user probe-secret || status=$?
          echo "the app that saved it: exit $status (0 = read)"
          test "$status" -eq 0
          status=0; update/rufin read "$service" probe-user probe-secret || status=$?
          echo "an update with the same identifier: exit $status (0 = read without asking)"
          test "$status" -eq 0
          status=0; renamed/rufin read "$service" probe-user probe-secret || status=$?
          echo "the renamed identifier: exit $status (3 = macOS would ask the user)"
          test "$status" -eq 3
          status=0; renamed/rufin read app.rufin.rufin probe-user probe-secret || status=$?
          echo "the new name finds the old entry: exit $status (2 = not found)"
          test "$status" -eq 2
          old/rufin delete "$service" probe-user
          paths="$(old/rufin paths)"
          echo "$paths"
          grep -F 'Library/Application Support/io.github.screwys.Rufin' <<<"$paths"
          grep -F 'Library/Caches/io.github.screwys.Rufin' <<<"$paths"
