[package]
name = "rufin"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
keywords = ["music", "audio", "gtk4", "jellyfin", "subsonic"]
categories = ["multimedia::audio", "gui"]
build = "build.rs"

[features]
development = ["app-identity/development"]

[[bin]]
name = "rufin"
path = "src/main.rs"

[dependencies]
app-identity.workspace = true
metadata-lookup.workspace = true
async-channel.workspace = true
artwork.workspace = true
directories.workspace = true
desktop-integration.workspace = true
downloads.workspace = true
getrandom.workspace = true
glib.workspace = true
md5.workspace = true
playback.workspace = true
playback-cast.workspace = true
playback-gstreamer.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
scrobbling.workspace = true
sources.workspace = true
secrets.workspace = true
library.workspace = true
lyrics.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
ui.workspace = true
url.workspace = true

[dev-dependencies]
localization.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-updater.workspace = true

[lints]
workspace = true
