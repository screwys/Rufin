[dependencies]
app-identity.workspace = true
metadata-lookup.workspace = true
artwork.workspace = true
gio.workspace = true
glib.workspace = true
localization.workspace = true
playback.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(all(unix, not(any(target_os = "android", target_vendor = "apple"))))'.dependencies]
ksni = { workspace = true, features = ["blocking"] }
mpris-server.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
async-channel.workspace = true
tray-icon.workspace = true
windows = { workspace = true, features = [
    "Data_Xml_Dom",
    "Foundation",
    "Media",
    "Media_Playback",
    "Storage_Streams",
    "System",
    "UI_Notifications",
] }
winsafe.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# mediaplayer 0.4.3 uses the CGRect layout provided through apple-cf 0.6.
apple-cf.workspace = true
