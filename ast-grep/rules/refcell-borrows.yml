id: finish-refcell-borrow-before-call
language: Rust
severity: error
message: Finish the RefCell borrow before calling another function.
rule:
  pattern: "{ $$$PREFIX let mut $STATE = $CELL.borrow_mut(); $$$BEFORE; $CALL($$$CALL_ARGS); $$$AFTER }"
constraints:
  CALL:
    all:
      - kind: identifier
      - not:
          regex: ^drop$
---
id: finish-refcell-borrow-before-widget-update
language: Rust
severity: error
message: Finish the RefCell borrow before updating the widget.
rule:
  any:
    - all:
        - pattern: $WIDGET.set_text($$$ARGS);
        - follows:
            pattern: let mut $STATE = $CELL.borrow_mut();
            stopBy: end
    - all:
        - pattern: $WIDGET.set_active($$$ARGS);
        - follows:
            pattern: let mut $STATE = $CELL.borrow_mut();
            stopBy: end
    - all:
        - pattern: $WIDGET.set_selected($$$ARGS);
        - follows:
            pattern: let mut $STATE = $CELL.borrow_mut();
            stopBy: end
    - all:
        - pattern: $WIDGET.set_value($$$ARGS);
        - follows:
            pattern: let mut $STATE = $CELL.borrow_mut();
            stopBy: end
---
id: copy-refcell-value-before-call
language: Rust
severity: error
message: Copy the RefCell value into a local variable before passing it to another function.
rule:
  any:
    - pattern: $CALL($CELL.borrow().clone())
    - pattern: $CALL($$$BEFORE, $CELL.borrow().clone(), $$$AFTER)
constraints:
  CALL:
    any:
      - kind: identifier
      - kind: field_expression
