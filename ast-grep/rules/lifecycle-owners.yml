id: notify-outside-refcell-owner-borrow
language: Rust
severity: error
message: Collect ready updates while the RefCell owner is borrowed, then notify outside the borrow.
rule:
  all:
    - pattern: $OWNER.with_typed_mut::<$$$TYPES>($CALLBACK)
    - has:
        pattern: $ITEM.replace($$$ARGS)
        stopBy: end
---
id: no-strong-clone-in-owned-signal
language: Rust
severity: error
message: A widget-owned signal must not capture a strong clone of its owning projection.
rule:
  any:
    - pattern: |
        {
          $$$BEFORE
          let $CAPTURE = $OWNER.clone();
          $$$MIDDLE
          $OWNER.$CONNECT(move |$$$PARAMS| {
            $$$BODY
            $CAPTURE.$METHOD($$$ARGS);
            $$$AFTER
          });
          $$$REST
        }
    - pattern: |
        {
          $$$BEFORE
          let $CAPTURE = $OWNER.clone();
          $$$MIDDLE
          $OWNER.$CONNECT(move |$$$PARAMS| {
            $$$BODY
            $CALL($$$CALL_ARGS, $CAPTURE.clone());
            $$$AFTER
          });
          $$$REST
        }
    - pattern: |
        {
          $$$BEFORE
          let $CAPTURE = Rc::clone(&$OWNER);
          $$$MIDDLE
          $OWNER.$CONNECT(move |$$$PARAMS| {
            $$$BODY
            $CALL($$$CALL_ARGS, $CAPTURE.clone());
            $$$AFTER
          });
          $$$REST
        }
    - pattern: |
        {
          $$$BEFORE
          let $CAPTURE = Rc::clone(&$OWNER);
          $$$MIDDLE
          $OWNER.$CONNECT(move |$$$PARAMS| {
            $$$BODY
            $CAPTURE.$METHOD($$$ARGS);
            $$$AFTER
          });
          $$$REST
        }
constraints:
  CONNECT:
    regex: ^connect_
---
id: popover-custom-child-registration-must-not-assert
language: Rust
severity: error
message: GtkPopoverMenu custom-child lookup is fallible; handle a missing placeholder without panicking in the GTK callback.
rule:
  any:
    - all:
        - pattern: debug_assert!($$$ARGS)
        - regex: \.add_child\s*\(
    - all:
        - pattern: assert!($$$ARGS)
        - regex: \.add_child\s*\(
---
id: detail-links-must-use-native-link-hover
language: Rust
severity: error
message: GtkLabel owns link hover controllers; DetailLinkBinding must not rebuild link state from a second motion controller.
rule:
  all:
    - pattern: gtk::EventControllerMotion::new()
    - inside:
        pattern: |
          impl DetailLinkBinding {
            $$$MEMBERS
          }
        stopBy: end
---
id: visualizer-lane-must-be-bounded
language: Rust
severity: error
message: Visualizer telemetry must use a bounded latest-frame lane.
rule:
  pattern: let ($EVENTS, $RECEIVER) = unbounded();
constraints:
  EVENTS:
    regex: visualizer
---
id: playback-publication-lane-must-be-bounded
language: Rust
severity: error
message: Playback position and state publications must use one bounded latest-value lane.
rule:
  pattern: let ($EVENTS, $RECEIVER) = unbounded();
constraints:
  EVENTS:
    regex: playback
---
id: mounted-route-callback-must-not-own-shell
language: Rust
severity: error
message: A mounted route callback must capture Weak<Shell> so route teardown cannot retain application ownership.
rule:
  any:
    - pattern: |
        let $CALLBACK = {
          let $SHELL = Rc::clone(self);
          $$$SETUP
          Rc::new(move || {
            $$$BEFORE
            $SHELL.$METHOD($$$ARGS);
            $$$AFTER
          })
        };
    - pattern: |
        let $CALLBACK = {
          $$$SETUP
          let $SHELL = Rc::clone(self);
          Rc::new(move |$$$PARAMS| {
            $$$BEFORE
            $SHELL.$METHOD($$$ARGS);
            $$$AFTER
          })
        };
---
id: artwork-tile-must-not-admit-on-map
language: Rust
severity: error
message: GTK factory bind owns artwork admission; map callbacks must not start or repeat cover work.
rule:
  all:
    - pattern: $WIDGET.connect_map($$$ARGS)
    - inside:
        pattern: |
          impl ArtworkTile {
            $$$MEMBERS
          }
        stopBy: end
---
id: sparse-ready-handlers-must-not-append
language: Rust
severity: error
message: Sparse readiness subscriptions are bind-owned and must replace an owner key, not append forever.
rule:
  all:
    - pattern: $HANDLERS.borrow_mut().push($HANDLER)
    - inside:
        pattern: |
          impl SparseObjectItem {
            $$$MEMBERS
          }
        stopBy: end
---
id: track-search-callback-must-not-own-track-projection
language: Rust
severity: error
message: Track search callbacks must capture the model or a weak read lane, never the widget-owning TrackListProjection.
rule:
  all:
    - any:
        - pattern: Rc::new(move || projection.source_count() != 0)
        - all:
            - pattern: |
                Rc::new(move || {
                  $$$BODY
                })
            - has:
                pattern: projection.source_count()
                stopBy: end
        - pattern: projection.search().connect_search_changed($$$ARGS)
    - inside:
        pattern: |
          fn track_page_route($$$PARAMS) -> MountedRoute {
            $$$FUNCTION_BODY
          }
        stopBy: end
---
id: source-acquisition-must-precede-serialized-lane
language: Rust
severity: error
message: Admit and cancel source acquisitions at request time; an older queued operation must not create a token that cancels a newer request.
rule:
  all:
    - pattern: $SHARED.begin_acquisition()
    - inside:
        pattern: |
          $OWNER.spawn_serialized(move |$$$PARAMS| async move {
            $$$BODY
          })
        stopBy: end
---
id: column-view-activation-needs-row-factory
language: Rust
severity: error
message: Shared ColumnView activation requires an explicit activatable GtkColumnViewRow factory.
rule:
  all:
    - pattern: $TABLE.connect_activate($$$ARGS)
    - inside:
        all:
          - pattern: |
              fn collection_table_with_width($$$PARAMS) {
                $$$BODY
              }
          - not:
              has:
                pattern: $TABLE.set_row_factory($$$FACTORY)
                stopBy: end
        stopBy: end
