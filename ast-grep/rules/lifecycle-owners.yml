id: notify-outside-refcell-owner-borrow
language: Rust
severity: error
message: Do not replace sparse items while their model RefCell is mutably borrowed; collect replacements and apply them afterward.
rule:
  all:
    - pattern: $OWNER.with_typed_mut::<$$$TYPES>($CALLBACK)
    - has:
        pattern: $ITEM.replace($$$ARGS)
        stopBy: end
---
id: no-strong-clone-in-owned-signal
language: Rust
severity: error
message: A signal stored on an object must not strongly capture that same object; the cycle would keep the UI alive after close.
rule:
  any:
    - pattern: |
        {
          $$$BEFORE
          let $CAPTURE = $OWNER.clone();
          $$$MIDDLE
          $OWNER.$CONNECT(move |$$$PARAMS| {
            $$$BODY
            $CAPTURE.$METHOD($$$ARGS);
            $$$AFTER
          });
          $$$REST
        }
    - pattern: |
        {
          $$$BEFORE
          let $CAPTURE = $OWNER.clone();
          $$$MIDDLE
          $OWNER.$CONNECT(move |$$$PARAMS| {
            $$$BODY
            $CALL($$$CALL_ARGS, $CAPTURE.clone());
            $$$AFTER
          });
          $$$REST
        }
    - pattern: |
        {
          $$$BEFORE
          let $CAPTURE = Rc::clone(&$OWNER);
          $$$MIDDLE
          $OWNER.$CONNECT(move |$$$PARAMS| {
            $$$BODY
            $CALL($$$CALL_ARGS, $CAPTURE.clone());
            $$$AFTER
          });
          $$$REST
        }
    - pattern: |
        {
          $$$BEFORE
          let $CAPTURE = Rc::clone(&$OWNER);
          $$$MIDDLE
          $OWNER.$CONNECT(move |$$$PARAMS| {
            $$$BODY
            $CAPTURE.$METHOD($$$ARGS);
            $$$AFTER
          });
          $$$REST
        }
constraints:
  CONNECT:
    regex: ^connect_
---
id: activatable-row-does-not-retain-itself
language: Rust
severity: error
message: An ActionRow owns its activatable button; the button callback must use a weak row reference or both widgets leak.
rule:
  any:
    - pattern: |
        {
          $$$BEFORE
          $ROW.set_activatable_widget(Some(&$BUTTON));
          $$$MIDDLE
          let $CAPTURE = $ROW.clone();
          $$$SETUP
          $BUTTON.$CONNECT(move |$$$PARAMS| {
            $$$BODY
            $CAPTURE.$METHOD($$$ARGS);
            $$$AFTER
          });
          $$$REST
        }
    - pattern: |
        {
          $$$BEFORE
          let $CAPTURE = $ROW.clone();
          $$$MIDDLE
          $ROW.set_activatable_widget(Some(&$BUTTON));
          $$$SETUP
          $BUTTON.$CONNECT(move |$$$PARAMS| {
            $$$BODY
            $CAPTURE.$METHOD($$$ARGS);
            $$$AFTER
          });
          $$$REST
        }
constraints:
  CONNECT:
    regex: ^connect_
---
id: popover-custom-child-registration-must-not-assert
language: Rust
severity: error
message: GtkPopoverMenu add_child can fail when a placeholder is missing; handle false instead of panicking in the GTK callback.
rule:
  any:
    - all:
        - pattern: debug_assert!($$$ARGS)
        - regex: \.add_child\s*\(
    - all:
        - pattern: assert!($$$ARGS)
        - regex: \.add_child\s*\(
---
id: visualizer-lane-must-be-bounded
language: Rust
severity: error
message: Use a one-item visualizer channel so a slow UI cannot build an unbounded frame backlog.
rule:
  pattern: let ($EVENTS, $RECEIVER) = unbounded();
constraints:
  EVENTS:
    regex: visualizer
---
id: playback-publication-lane-must-be-bounded
language: Rust
severity: error
message: Use a one-item playback channel so position updates cannot build an unbounded backlog.
rule:
  pattern: let ($EVENTS, $RECEIVER) = unbounded();
constraints:
  EVENTS:
    regex: playback
---
id: mounted-route-callback-must-not-own-shell
language: Rust
severity: error
message: A callback stored by MountedRoute must use Weak<Shell>; a strong Rc would keep the whole app graph alive after navigation.
rule:
  any:
    - pattern: |
        let $CALLBACK = {
          let $SHELL = Rc::clone(self);
          $$$SETUP
          Rc::new(move || {
            $$$BEFORE
            $SHELL.$METHOD($$$ARGS);
            $$$AFTER
          })
        };
    - pattern: |
        let $CALLBACK = {
          $$$SETUP
          let $SHELL = Rc::clone(self);
          Rc::new(move |$$$PARAMS| {
            $$$BEFORE
            $SHELL.$METHOD($$$ARGS);
            $$$AFTER
          })
        };
---
id: artwork-tile-must-not-admit-on-map
language: Rust
severity: error
message: Do not start artwork from connect_map; remapping a row would repeat requests that factory bind already owns.
rule:
  all:
    - pattern: $WIDGET.connect_map($$$ARGS)
    - inside:
        pattern: |
          impl ArtworkTile {
            $$$MEMBERS
          }
        stopBy: end
---
id: sparse-ready-handlers-must-not-append
language: Rust
severity: error
message: Rebinding a sparse row must replace its ready callback, not append callbacks that survive every bind.
rule:
  all:
    - pattern: $HANDLERS.borrow_mut().push($HANDLER)
    - inside:
        pattern: |
          impl SparseObjectItem {
            $$$MEMBERS
          }
        stopBy: end
---
id: scrolled-box-is-behind-viewport
language: Rust
severity: error
message: A GtkBox inside GtkScrolledWindow is under GtkViewport, not the direct child; retrieve the named box or unwrap the viewport first.
rule:
  any:
    - pattern: $SCROLLER.child().and_then(|$CHILD| $CHILD.downcast::<gtk::Box>().ok())
    - pattern: $SCROLLER.child().and_downcast::<gtk::Box>()
constraints:
  SCROLLER:
    regex: scroller
---
id: track-search-callback-must-not-own-track-projection
language: Rust
severity: error
message: A search callback must not retain the whole TrackListProjection; capture its model or a weak request lane so the route can close.
rule:
  all:
    - any:
        - pattern: Rc::new(move || projection.source_count() != 0)
        - all:
            - pattern: |
                Rc::new(move || {
                  $$$BODY
                })
            - has:
                pattern: projection.source_count()
                stopBy: end
        - pattern: projection.search().connect_search_changed($$$ARGS)
    - inside:
        pattern: |
          fn track_page_route($$$PARAMS) -> MountedRoute {
            $$$FUNCTION_BODY
          }
        stopBy: end
---
id: source-acquisition-must-precede-serialized-lane
language: Rust
severity: error
message: Create the source cancellation token before queueing the request; otherwise an older queued request can cancel a newer one.
rule:
  all:
    - pattern: $SHARED.begin_acquisition()
    - inside:
        pattern: |
          $OWNER.spawn_serialized(move |$$$PARAMS| async move {
            $$$BODY
          })
        stopBy: end
---
id: column-view-activation-needs-row-factory
language: Rust
severity: error
message: Mark shared ColumnView rows activatable before connect_activate or clicks and Enter will not open them.
rule:
  all:
    - pattern: $TABLE.connect_activate($$$ARGS)
    - inside:
        all:
          - pattern: |
              fn collection_table_with_width($$$PARAMS) {
                $$$BODY
              }
          - not:
              has:
                pattern: $TABLE.set_row_factory($$$FACTORY)
                stopBy: end
        stopBy: end
