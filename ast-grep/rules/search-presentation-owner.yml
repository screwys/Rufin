id: search-keeps-only-active-presentation
language: Rust
severity: error
message: Search may retain three result models, but only the selected tab may retain a collection view and toolbar.
rule:
  all:
    - kind: field_declaration
    - regex: ':\s*\[(LibraryCollectionProjection|LibraryToolbarProjection)\s*;'
    - inside:
        pattern: |
          struct SearchRouteProjection {
            $$$FIELDS
          }
        stopBy: end
---
id: search-registers-now-playing-once
language: Rust
severity: error
message: Register Search now-playing updates once for the route, not again whenever the selected category view is rebuilt.
rule:
  all:
    - pattern: $SHELL.register_current_route_track_selection($$$ARGS)
    - inside:
        pattern: |
          fn search_collection($$$PARAMS) -> LibraryCollectionProjection {
            $$$BODY
          }
        stopBy: end
