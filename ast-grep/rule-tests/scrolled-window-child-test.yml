id: scrolled-content-is-behind-viewport
valid:
  - |
      fn content(scroller: &gtk::ScrolledWindow) -> Option<gtk::Box> {
          scroller
              .child()
              .and_then(|child| child.downcast::<gtk::Viewport>().ok())
              .and_then(|viewport| viewport.child())
              .and_then(|child| child.downcast::<gtk::Box>().ok())
      }
invalid:
  - |
      fn content(scroller: &gtk::ScrolledWindow) -> Option<gtk::Box> {
          scroller
              .child()
              .and_then(|child| child.downcast::<gtk::Box>().ok())
      }
  - |
      fn metadata_label() {
          let clip = album_meta_label("", "muted", 1);
          let label = clip.child().and_downcast::<gtk::Label>().expect("album metadata label");
      }
