id: visualizer-lane-must-be-bounded
valid:
  - |
      fn channels() {
          let (visualizer_events, visualizer_receiver) = bounded(1);
      }
  - |
      fn channels() {
          let (playback_events, playback_receiver) = unbounded();
      }
invalid:
  - |
      fn channels() {
          let (visualizer_events, visualizer_receiver) = unbounded();
      }
---
id: playback-publication-lane-must-be-bounded
valid:
  - |
      fn channels() {
          let (playback_events, playback_receiver) = bounded(1);
      }
invalid:
  - |
      fn channels() {
          let (playback_events, playback_receiver) = unbounded();
      }
---
id: mounted-route-callback-must-not-own-shell
valid:
  - |
      fn route(self: &Rc<Self>) {
          let resume = {
              let shell = Rc::downgrade(self);
              Rc::new(move || {
                  let Some(shell) = shell.upgrade() else { return };
                  shell.refresh();
              })
          };
      }
invalid:
  - |
      fn route(self: &Rc<Self>) {
          let resume = {
              let shell = Rc::clone(self);
              Rc::new(move || {
                  shell.refresh();
              })
          };
      }
