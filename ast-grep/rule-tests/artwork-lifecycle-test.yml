id: artwork-tile-must-not-admit-on-map
valid:
  - |
      impl ArtworkTile {
          fn install_cleanup(&self) {
              self.area.connect_destroy(|_| {});
          }
      }
invalid:
  - |
      impl ArtworkTile {
          fn install_admission(&self) {
              self.area.connect_map(|_| start_artwork());
          }
      }
