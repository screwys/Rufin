id: cover-hover-controller-must-not-own-overlay
valid:
  - |
      fn connect_hover(&self, overlay: &gtk::Overlay) {
          let motion = gtk::EventControllerMotion::new();
          let overlay_for_leave = overlay.downgrade();
          motion.connect_leave(move |_| {
              if overlay_for_leave.upgrade().is_some() {}
          });
          overlay.add_controller(motion);
      }
invalid:
  - |
      fn connect_hover(&self, overlay: &gtk::Overlay) {
          let motion = gtk::EventControllerMotion::new();
          let overlay_for_leave = overlay.clone();
          motion.connect_leave(move |_| {
              overlay_for_leave.set_visible(false);
          });
          overlay.add_controller(motion);
      }
